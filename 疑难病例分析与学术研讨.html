function getDiscussionCount(comments) {
    return (comments || []).reduce(function(sum, item) {
        return sum + 1 + getDiscussionCount(item.replies || []);
    }, 0);
}

function getNowTime() {
    var now = new Date();
    return now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0') + ' ' +
        String(now.getHours()).padStart(2,'0') + ':' +
        String(now.getMinutes()).padStart(2,'0');
}

function getCurrentUserName() {
    return document.getElementById('headerUserName').textContent || '匿名用户';
}

function renderNotifications() {
    var count = notifications.filter(function(n) { return n.unread; }).length;
    document.getElementById('noticeCount').textContent = count;
    var list = document.getElementById('noticeList');
    if (!list) return;
    if (notifications.length === 0) {
        list.innerHTML = '<div class="notice-item">暂无消息通知</div>';
        return;
    }
    list.innerHTML = notifications.map(function(n) {
        return '<div class="notice-item'+(n.unread ? ' unread' : '')+'">' +
            '<div>'+escapeHtml(n.title)+'</div>' +
            '<div style="margin-top:3px;">'+escapeHtml(n.text)+'</div>' +
            '<div class="notice-meta">'+escapeHtml(n.caseTitle)+' · '+escapeHtml(n.time)+'</div>' +
        '</div>';
    }).join('');
}

function toggleNotifications(event) {
    if (event) event.stopPropagation();
    var panel = document.getElementById('notificationPanel');
    panel.classList.toggle('show');
}

function markNotificationsRead(event) {
    if (event) event.stopPropagation();
    notifications.forEach(function(n) { n.unread = false; });
    renderNotifications();
}

function addNotification(title, caseTitle, text, time) {
    notifications.unshift({ title: title, caseTitle: caseTitle, text: text, time: time, unread: true });
    renderNotifications();
}

function switchSection(type) {
    activeSection = type;
    document.getElementById('caseTabBtn').classList.toggle('active', type === 'case');
    document.getElementById('articleTabBtn').classList.toggle('active', type === 'article');
    document.getElementById('casePanel').classList.toggle('active', type === 'case');
    document.getElementById('articlePanel').classList.toggle('active', type === 'article');
}

// ========== 渲染病例列表 ==========
function renderCaseList(caseArray) {
    var container = document.getElementById('caseList');
    if (!caseArray || caseArray.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div>暂无匹配病例</div>';
        return;
    }
    var html = '';
    caseArray.forEach(function(c) {
        html += '<div class="discuss-item" style="flex-direction:column;align-items:stretch;cursor:pointer;" onclick="showDetail(\'case\',' + c.id + ')">' +
            '<div style="display:flex;align-items:center;">' +
                '<div class="discuss-info" style="flex:1;">' +
                    '<div class="discuss-title" style="color:var(--gray-800);">' +
                        c.title +
                    '</div>' +
                    '<div class="discuss-desc">' + c.desc + '</div>' +
                '</div>' +
                '<div class="discuss-stats" style="flex-shrink:0;margin-left:16px;">' +
                    '<span>👁 ' + c.views + '</span>' +
                '</div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:16px;margin-top:6px;padding-left:2px;">' +
                '<span style="font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:3px;">💬 ' + getDiscussionCount(c.comments) + ' 讨论</span>' +
                '<span style="font-size:12px;color:var(--gray-400);margin-left:auto;">' + c.disease + ' · ' + c.author + ' · ' + c.date + '</span>' +
            '</div>' +
        '</div>';
    });
    container.innerHTML = html;
}

// ========== 渲染知识传播文章列表 ==========
function renderArticleList(articleArray) {
    var container = document.getElementById('articleList');
    if (!articleArray || articleArray.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div>暂无匹配文章</div>';
        return;
    }
    var html = '';
    articleArray.forEach(function(a) {
        html += '<div class="discuss-item" style="flex-direction:column;align-items:stretch;cursor:pointer;" onclick="showDetail(\'article\',' + a.id + ')">' +
            '<div style="display:flex;align-items:center;">' +
                '<div class="discuss-info" style="flex:1;">' +
                    '<div class="discuss-title" style="color:var(--gray-800);">' +
                        '<span class="article-tag">' + escapeHtml(a.category) + '</span>' + escapeHtml(a.title) +
                    '</div>' +
                    '<div class="discuss-desc">' + escapeHtml(a.summary) + '</div>' +
                '</div>' +
                '<div class="discuss-stats" style="flex-shrink:0;margin-left:16px;">' +
                    '<span>👁 ' + a.views + '</span>' +
                '</div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:16px;margin-top:6px;padding-left:2px;">' +
                '<span style="font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:3px;">💬 ' + getDiscussionCount(a.comments) + ' 讨论</span>' +
                '<span style="font-size:12px;color:var(--gray-400);margin-left:auto;">' + escapeHtml(a.role) + ' · ' + escapeHtml(a.author) + ' · ' + escapeHtml(a.date) + '</span>' +
            '</div>' +
        '</div>';
    });
    container.innerHTML = html;
}

// ========== 搜索 + 筛选 ==========
function filterCases() {
    var keyword = document.getElementById('searchInput').value.trim().toLowerCase();
    var disease = document.getElementById('diseaseFilter').value;
    var filtered = cases.filter(function(c) {
        var matchKeyword = !keyword ||
            c.title.toLowerCase().indexOf(keyword) !== -1 ||
            c.desc.toLowerCase().indexOf(keyword) !== -1 ||
            c.disease.toLowerCase().indexOf(keyword) !== -1;
        var matchDisease = !disease || c.disease === disease;
        return matchKeyword && matchDisease;
    });
    renderCaseList(filtered);
}

function filterArticles() {
    var keyword = document.getElementById('articleSearchInput').value.trim().toLowerCase();
    var category = document.getElementById('articleCategoryFilter').value;
    var filtered = knowledgeArticles.filter(function(a) {
        var matchKeyword = !keyword ||
            a.title.toLowerCase().indexOf(keyword) !== -1 ||
            a.summary.toLowerCase().indexOf(keyword) !== -1 ||
            a.category.toLowerCase().indexOf(keyword) !== -1 ||
            a.author.toLowerCase().indexOf(keyword) !== -1;
        var matchCategory = !category || a.category === category;
        return matchKeyword && matchCategory;
    });
    renderArticleList(filtered);
}

// ========== 详情页 ==========
function showDetail(type, id) {
    var c = getDiscussionItem(type, id);
    if (!c) return;
    currentDetailId = id;
    currentDetailType = type;
    activeSection = type;
    document.getElementById('listView').style.display = 'none';
    document.getElementById('detailView').style.display = 'block';

    document.getElementById('detailTitle').textContent = c.title;
    if (type === 'article') {
        document.getElementById('detailMeta').textContent = '作者：' + c.author + ' | 角色：' + c.role + ' | 发布时间：' + c.date + ' | 文章分类：' + c.category;
        document.getElementById('detailActionBtn').textContent = '上传文章';
        document.getElementById('detailDiscussionLabel').textContent = '文章讨论';
        document.getElementById('commentTitleLabel').textContent = '文章讨论';
        document.getElementById('newCommentInput').placeholder = '围绕这篇文章发表你的观点、补充案例或提出问题...';
    } else {
        document.getElementById('detailMeta').textContent = '发布者：' + c.author + ' | 发布时间：' + c.date + ' | 疾病分类：' + c.disease;
        document.getElementById('detailActionBtn').textContent = '分享病例';
        document.getElementById('detailDiscussionLabel').textContent = '病例研讨';
        document.getElementById('commentTitleLabel').textContent = '病例讨论';
        document.getElementById('newCommentInput').placeholder = '发表你的观点和见解...';
    }
    document.getElementById('detailContent').innerHTML = c.content;

    // 评论数
    document.getElementById('detailCommentCount').textContent = getDiscussionCount(c.comments);
    renderComments(c);
}

function showList() {
    document.getElementById('detailView').style.display = 'none';
    document.getElementById('listView').style.display = 'block';
    switchSection(activeSection);
    if (activeSection === 'article') filterArticles();
    else filterCases();
}

function openCurrentPublishModal() {
    openModal(currentDetailType === 'article' ? 'articleModal' : 'shareModal');
}

// ========== 评论区展开/收起 ==========
function toggleCommentSection() {
    var section = document.getElementById('commentSection');
    if (section.style.display === 'none') {
        section.style.display = 'block';
    } else {
        section.style.display = 'none';
    }
}

// ========== 渲染评论列表 ==========
function renderComments(c) {
    var container = document.getElementById('commentList');
    var total = getDiscussionCount(c.comments);
    document.getElementById('commentTotal').textContent = total;
    document.getElementById('detailCommentCount').textContent = total;
    if (total === 0) {
        container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--gray-400);font-size:13px;">暂无讨论，快来发表你的见解吧</div>';
        return;
    }
    container.innerHTML = c.comments.map(function(cm, idx) {
        return renderDiscussionNode(cm, c.id, [idx], 0);
    }).join('');
}

function renderDiscussionNode(item, caseId, path, depth) {
    var pathKey = path.join('_');
    var isReply = depth > 0;
    var itemClass = isReply ? 'reply-item' : 'comment-item';
    var authorClass = isReply ? 'reply-author' : 'comment-author';
    var textClass = isReply ? 'reply-text' : 'comment-text';
    var metaClass = isReply ? 'reply-meta' : 'comment-meta';
    var replies = item.replies || [];
    var html = '<div class="'+itemClass+'">';
    html += '<div class="'+authorClass+'">' + escapeHtml(item.author);
    if (item.role) html += '<span class="role-tag">' + escapeHtml(item.role) + '</span>';
    if (isReply && item.replyTo) html += '<span class="reply-target"> 回复 @' + escapeHtml(item.replyTo) + '</span>';
    html += '</div>';
    html += '<div class="'+textClass+'">' + escapeHtml(item.text) + '</div>';
    html += '<div class="'+metaClass+'"><span>' + escapeHtml(item.time) + '</span><button class="reply-link" onclick="toggleReplyBox(event,' + caseId + ',\'' + pathKey + '\')">回复</button></div>';
    html += '<div class="reply-box" id="replyBox_' + caseId + '_' + pathKey + '">' +
        '<textarea id="replyText_' + caseId + '_' + pathKey + '" placeholder="回复 @' + escapeHtml(item.author) + '..."></textarea>' +
        '<button class="btn btn-primary" style="flex-shrink:0;" onclick="submitReply(' + caseId + ',\'' + pathKey + '\')">发送</button>' +
        '<button class="btn btn-outline" style="flex-shrink:0;" onclick="toggleReplyBox(event,' + caseId + ',\'' + pathKey + '\')">取消</button>' +
    '</div>';
    if (replies.length) {
        html += '<div class="reply-list">';
        replies.forEach(function(reply, idx) {
            html += renderDiscussionNode(reply, caseId, path.concat(idx), depth + 1);
        });
        html += '</div>';
    }
    html += '</div>';
    return html;
}

function getCommentByPath(comments, pathText) {
    var parts = pathText.split('_').map(function(n) { return parseInt(n, 10); });
    var current = null;
    var list = comments;
    for (var i = 0; i < parts.length; i++) {
        current = list[parts[i]];
        if (!current) return null;
        list = current.replies || [];
    }
    return current;
}

function toggleReplyBox(event, caseId, pathText) {
    if (event) event.stopPropagation();
    var boxId = 'replyBox_' + caseId + '_' + pathText;
    document.querySelectorAll('.reply-box.show').forEach(function(box) {
        if (box.id !== boxId) box.classList.remove('show');
    });
    var box = document.getElementById(boxId);
    if (!box) return;
    box.classList.toggle('show');
    if (box.classList.contains('show')) {
        var input = document.getElementById('replyText_' + caseId + '_' + pathText);
        if (input) input.focus();
    }
}

function submitReply(caseId, pathText) {
    var c = getDiscussionItem(currentDetailType, caseId);
    if (!c) return;
    var target = getCommentByPath(c.comments, pathText);
    var input = document.getElementById('replyText_' + caseId + '_' + pathText);
    var text = input ? input.value.trim() : '';
    if (!target || !text) {
        showToast('请输入回复内容');
        return;
    }
    var timeStr = getNowTime();
    var userName = getCurrentUserName();
    target.replies = target.replies || [];
    target.replies.push({
        author: userName,
        role: '参与者',
        replyTo: target.author,
        text: text,
        time: timeStr,
        replies: []
    });
    renderComments(c);
    addNotification('新的讨论回复', c.title, userName + ' 回复了 ' + target.author + ' 的观点', timeStr);
    showToast('回复已发送，对方将收到消息通知');
}

// ========== 提交评论 ==========
function submitComment() {
    var input = document.getElementById('newCommentInput');
    var text = input.value.trim();
    if (!text) {
        showToast('请输入评论内容');
        return;
    }
    if (currentDetailId === null) return;
    var c = getDiscussionItem(currentDetailType, currentDetailId);
    if (!c) return;

    var timeStr = getNowTime();
    var userName = getCurrentUserName();
    c.comments.unshift({
        author: userName,
        role: '参与者',
        text: text,
        time: timeStr,
        replies: []
    });
    input.value = '';
    renderComments(c);
    addNotification('新的讨论', c.title, userName + ' 发布了一条新的讨论内容', timeStr);
    showToast('讨论发表成功');
}

// ========== 分享病例（修改1） ==========
function shareCase() {
    var title = document.getElementById('shareTitle').value.trim();
    var disease = document.getElementById('shareDisease').value;
    var desc = document.getElementById('shareDesc').value.trim();

    // 必填项校验
    if (!title || !disease || !desc) {
        showToast('请填写完整信息（病例标题、疾病分类、病例简介为必填项）');
        return;
    }

    var now = new Date();
    var dateStr = now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0');
    var userName = document.getElementById('headerUserName').textContent || '匿名用户';

    // 生成内容摘要（取描述前60字）
    var summary = desc.length > 60 ? desc.substring(0, 60) + '...' : desc;

    var newCase = {
        id: caseIdCounter++,
        title: title,
        disease: disease,
        tag: '疑难',
        desc: summary,
        author: userName,
        department: '眼科',
        date: dateStr,
        views: 0,
        comments: [],
        content: `<h3>病例简介</h3><p>${escapeHtml(desc)}</p>`
    };

    // 新病例插入列表顶部
    cases.unshift(newCase);

    // 清空表单
    document.getElementById('shareTitle').value = '';
    document.getElementById('shareDisease').value = '';
    document.getElementById('shareDesc').value = '';
    document.getElementById('filePreview').innerHTML = '';

    closeModal('shareModal');
    // 刷新列表显示新病例
    filterCases();
    showToast('病例分享成功！已添加到列表顶部');
}

function publishArticle() {
    var title = document.getElementById('articleTitle').value.trim();
    var category = document.getElementById('articleCategory').value;
    var summary = document.getElementById('articleSummary').value.trim();
    var content = document.getElementById('articleContent').value.trim();
    if (!title || !category || !summary || !content) {
        showToast('请填写完整信息（文章标题、文章分类、文章摘要、文章正文为必填项）');
        return;
    }
    var now = new Date();
    var dateStr = now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2,'0') + '-' +
        String(now.getDate()).padStart(2,'0');
    var userName = getCurrentUserName();
    var newArticle = {
        id: articleIdCounter++,
        title: title,
        category: category,
        summary: summary,
        author: userName,
        role: '教师',
        date: dateStr,
        views: 0,
        comments: [],
        content: '<div class="article-lead">'+escapeHtml(summary)+'</div><p>'+escapeHtml(content).replace(/\n/g,'</p><p>')+'</p>'
    };
    knowledgeArticles.unshift(newArticle);
    document.getElementById('articleTitle').value = '';
    document.getElementById('articleCategory').value = '';
    document.getElementById('articleSummary').value = '';
    document.getElementById('articleContent').value = '';
    closeModal('articleModal');
    filterArticles();
    showToast('文章发布成功！已添加到知识传播列表顶部');
}

// ========== 文件上传预览 ==========
function handleFileSelect(event) {
    var files = event.target.files;
    var preview = document.getElementById('filePreview');
    if (files.length === 0) {
        preview.innerHTML = '';
        return;
    }
    var names = [];
    for (var i = 0; i < files.length; i++) {
        names.push(files[i].name);
    }
    preview.innerHTML = '已选择 ' + files.length + ' 个文件：' + names.join('、');
}

// ========== 弹窗控制 ==========
function openModal(id) {
    var el = document.getElementById(id);
    if (el) {
        el.style.display = 'flex';
        el.classList.add('show');
    }
}
function closeModal(id) {
    var el = document.getElementById(id);
    if (el) {
        el.style.display = 'none';
        el.classList.remove('show');
    }
}

// ========== 侧边栏 ==========
function toggleSubmenu(el) {
    el.classList.toggle('expanded');
    var sub = el.nextElementSibling;
    if (sub && sub.classList.contains('submenu')) {
        sub.classList.toggle('open');
    }
}

// ========== 退出 ==========
function logout() {
    if (confirm('确定要退出登录吗？')) {
        localStorage.removeItem('life_med_user');
        window.location.href = 'login.html';
    }
}

// ========== Toast 提示 ==========
function showToast(msg) {
    var toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function() {
        toast.classList.remove('show');
    }, 2500);
}

// ========== HTML 转义 ==========
function escapeHtml(text) {
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
}

// 点击弹窗外部关闭
document.addEventListener('click', function(e) {
    if (e.target.classList.contains('modal-overlay')) {
        e.target.style.display = 'none';
        e.target.classList.remove('show');
    }
    var panel = document.getElementById('notificationPanel');
    if (panel && !e.target.closest('.notification-widget')) {
        panel.classList.remove('show');
    }
});
</script>
