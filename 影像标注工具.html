function buildSyntheticPreview(width, height, meta, layerIndex) {
  var c = document.createElement('canvas');
  c.width = width; c.height = height;
  var g = c.getContext('2d');
  g.fillStyle = '#07111f';
  g.fillRect(0, 0, width, height);
  if (meta.type === 'OCTA') {
    var centerX = width * 0.5, centerY = height * 0.5, radius = Math.min(width, height) * 0.42;
    var vesselBg = g.createRadialGradient(centerX, centerY, radius * 0.05, centerX, centerY, radius);
    vesselBg.addColorStop(0, '#101827'); vesselBg.addColorStop(0.55, '#070b13'); vesselBg.addColorStop(1, '#02040a');
    g.fillStyle = vesselBg; g.fillRect(0, 0, width, height);
    g.save();
    g.beginPath(); g.arc(centerX, centerY, radius, 0, Math.PI * 2); g.clip();
    for (var vessel = 0; vessel < 34; vessel++) {
      var angle = (vessel / 34) * Math.PI * 2;
      var branch = radius * (0.18 + (vessel % 7) * 0.08);
      g.beginPath();
      g.strokeStyle = vessel % 3 === 0 ? 'rgba(180,235,255,0.76)' : 'rgba(96,196,226,0.62)';
      g.lineWidth = vessel % 4 === 0 ? 2.1 : 1.2;
      g.moveTo(centerX + Math.cos(angle) * radius * 0.08, centerY + Math.sin(angle) * radius * 0.08);
      for (var step = 1; step <= 8; step++) {
        var dist = branch + step * radius * 0.07;
        var bend = Math.sin(step * 0.9 + vessel) * 0.18;
        g.lineTo(centerX + Math.cos(angle + bend) * dist, centerY + Math.sin(angle + bend) * dist);
      }
      g.stroke();
    }
    g.strokeStyle = 'rgba(220,245,255,0.28)';
    g.lineWidth = 1;
    for (var ring = 1; ring <= 4; ring++) {
      g.beginPath(); g.arc(centerX, centerY, radius * (0.18 + ring * 0.15), 0, Math.PI * 2); g.stroke();
    }
    g.restore();
    g.fillStyle = 'rgba(4,8,16,0.6)';
    g.beginPath(); g.arc(centerX, centerY, radius * 0.09, 0, Math.PI * 2); g.fill();
  } else if (meta.type === 'OCT') {
    var grad = g.createLinearGradient(0, 0, 0, height);
    grad.addColorStop(0, '#06101c'); grad.addColorStop(0.45, '#121b27'); grad.addColorStop(1, '#05070c');
    g.fillStyle = grad; g.fillRect(0, 0, width, height);
    for (var i = 0; i < 7; i++) {
      g.beginPath();
      g.strokeStyle = 'rgba(' + (120+i*18) + ',' + (150+i*10) + ',170,0.75)';
      g.lineWidth = i === 3 ? 3 : 1.4;
      var yBase = height * (0.32 + i * 0.055) + Math.sin((layerIndex+i)*0.25) * 12;
      g.moveTo(30, yBase);
      for (var x = 30; x < width - 30; x += 30) {
        g.lineTo(x, yBase + Math.sin(x/70 + layerIndex/6 + i) * (9 + i));
      }
      g.stroke();
    }
  } else {
    var cx = width * 0.5, cy = height * 0.52, r = Math.min(width, height) * 0.42;
    var fundus = g.createRadialGradient(cx - r*0.2, cy - r*0.1, r*0.06, cx, cy, r);
    fundus.addColorStop(0, '#c97925'); fundus.addColorStop(0.35, '#753016'); fundus.addColorStop(0.72, '#36120c'); fundus.addColorStop(1, '#080305');
    g.fillStyle = fundus; g.beginPath(); g.arc(cx, cy, r, 0, Math.PI*2); g.fill();
    g.fillStyle = 'rgba(255,210,140,0.85)'; g.beginPath(); g.arc(cx + r*0.26, cy - r*0.05, r*0.11, 0, Math.PI*2); g.fill();
    g.strokeStyle = 'rgba(210,60,52,0.65)'; g.lineWidth = 2;
    for (var v = 0; v < 15; v++) {
      var ang = (v / 15) * Math.PI * 2 + layerIndex * 0.01;
      g.beginPath(); g.moveTo(cx + r*0.25, cy - r*0.05);
      g.quadraticCurveTo(cx + Math.cos(ang)*r*0.35, cy + Math.sin(ang)*r*0.25, cx + Math.cos(ang)*r*0.78, cy + Math.sin(ang)*r*0.65);
      g.stroke();
    }
  }
  g.fillStyle = 'rgba(0,0,0,0.45)';
  g.fillRect(16, 16, 285, 58);
  g.fillStyle = '#d8e7ff';
  g.font = '18px Microsoft YaHei, Arial';
  g.fillText(meta.type + ' 在线阅片预览', 30, 42);
  g.font = '12px Microsoft YaHei, Arial';
  g.fillText(meta.checkProject + ' | ' + getImageClassificationDisplay(meta) + ' | ' + (meta.annotationStatus || '未阅片') + ' | Layer ' + (layerIndex + 1), 30, 63);
  return c.toDataURL('image/png');
}

/* ============ IMAGE LIST & FILTER ============ */
function updateImageList() {
  var container = document.getElementById('imageList');
  var html = '';
  var filtered = getFilteredImages();
  var groups = {};
  for (var i = 0; i < filtered.length; i++) {
    var dateKey = filtered[i].date || '未知日期';
    if (!groups[dateKey]) groups[dateKey] = [];
    groups[dateKey].push(filtered[i]);
  }
  var dates = Object.keys(groups).sort(function(a,b){ return sortDesc ? b.localeCompare(a) : a.localeCompare(b); });
  for (var d = 0; d < dates.length; d++) {
    var date = dates[d];
    var collapsed = !!collapsedDateGroups[date];
    html += '<div class="image-date-group"><div class="image-date-header" onclick="toggleDateGroup(\'' + date + '\')">' +
      '<strong>' + (collapsed ? '▸ ' : '▾ ') + date + '</strong><span>' + groups[date].length + ' 项检查</span></div>';
    if (!collapsed) {
      for (var j = 0; j < groups[date].length; j++) {
        var img = groups[date][j];
        var idx = uploadedImages.indexOf(img);
        var cls = idx === currentImageIndex ? 'active' : '';
        html += '<div class="image-list-item ' + cls + '" onclick="switchImage(' + idx + ')">' +
          '<div class="thumb">' + (img.url ? '<img src="' + img.url + '">' : img.type.substring(0,3)) + '</div>' +
          '<div class="info">' +
            '<div class="name">' + img.name + '</div>' +
            '<div class="meta">' + img.type + ' | ' + (img.checkProject || '检查项目未记录') + '</div>' +
            '<div class="meta">患者:' + img.patientId + '</div>' +
            '<span class="result-tag">' + getImageClassificationDisplay(img) + '</span>' +
            '<span class="annotation-tag">' + (img.qualityReport ? img.qualityReport.statusText : '待质控') + '</span>' +
            '<span class="annotation-tag">' + (img.annotationStatus || '未阅片') + '</span>' +
          '</div></div>';
      }
    }
    html += '</div>';
  }
  container.innerHTML = html || '<div style="font-size:11px;color:#667;padding:8px;">暂无符合条件的影像</div>';
  updateImageCount();
  ensureFirstVisibleImageSelected(filtered);
}

function ensureFirstVisibleImageSelected(filtered) {
  if (!filtered || !filtered.length) return;
  for (var i = 0; i < filtered.length; i++) {
    if (uploadedImages.indexOf(filtered[i]) === currentImageIndex) return;
  }
  var firstIndex = uploadedImages.indexOf(filtered[0]);
  if (firstIndex >= 0 && firstIndex !== currentImageIndex) switchImage(firstIndex);
}

function getFilteredImages() {
  updateDiseaseFilterOptions();
  var dateVal = document.getElementById('filterDate').value;
  var projectVal = document.getElementById('filterProject').value;
  var resultVal = document.getElementById('filterResult').value;
  var annotationStatusVal = document.getElementById('filterAnnotationStatus').value;
  var qualityStatusVal = document.getElementById('filterQualityStatus').value;
  var result = uploadedImages.filter(function(img) {
    if (!showAllDates && dateVal && img.date !== dateVal) return false;
    if (projectVal && img.checkProject !== projectVal) return false;
    if (resultVal && !hasImageDiseaseLabel(img, resultVal)) return false;
    if (annotationStatusVal && (img.annotationStatus || '未阅片') !== annotationStatusVal) return false;
    if (qualityStatusVal) {
      var qualityReport = ensureQualityAssessment(img);
      if (qualityStatusVal === 'pass' && qualityReport.status !== 'pass') return false;
      if (qualityStatusVal === 'not-pass' && qualityReport.status === 'pass') return false;
    }
    return true;
  });
  result.sort(function(a,b) {
    var v = (a.date || '').localeCompare(b.date || '');
    if (v === 0) v = (a.name || '').localeCompare(b.name || '');
    return sortDesc ? -v : v;
  });
  return result;
}

function updateDiseaseFilterOptions() {
  var select = document.getElementById('filterResult');
  if (!select) return;
  var current = select.value;
  var categories = getAvailableDiseaseCategories();
  var html = '<option value="">全部检查结果</option>';
  var hasCurrent = current === '';
  for (var i = 0; i < categories.length; i++) {
    var name = categories[i] && categories[i].name ? categories[i].name : '';
    if (!name) continue;
    if (name === current) hasCurrent = true;
    html += '<option value="' + escapeLabelText(name) + '"' + (name === current ? ' selected' : '') + '>' + escapeLabelText(name) + '</option>';
  }
  select.innerHTML = html;
  if (!hasCurrent) select.value = '';
}

    document.getElementById('statusImgSize').textContent = '-';
    document.getElementById('statusPixelInfo').textContent = '-';
    return;
  }
  uploadedImages.splice(index, 1);
  var nextIndex = currentImageIndex;
  if (index === currentImageIndex) nextIndex = Math.min(index, uploadedImages.length - 1);
  else if (index < currentImageIndex) nextIndex = currentImageIndex - 1;
  currentImageIndex = -1;
  switchImage(nextIndex);
}

function ensureLayerStores(img) {
  if (!img.annotations) img.annotations = [];
  if (!img.aiAnnotations) img.aiAnnotations = [];
  if (!img.measurements) img.measurements = [];
  if (!img.layerCount || img.layerCount <= 1) return;
  if (!img.layerAnnotations) img.layerAnnotations = [];
  if (!img.layerAiAnnotations) img.layerAiAnnotations = [];
  if (!img.layerMeasurements) img.layerMeasurements = [];
  if (!img.layerDataInitialized) {
    var baseLayer = Math.max(0, Math.min(img.currentLayer || 0, img.layerCount - 1));
    var hasTopLevelData = img.annotations.length || img.aiAnnotations.length || img.measurements.length;
    var hasLayerData = img.layerAnnotations.some(function(layer){ return Array.isArray(layer) && layer.length; }) ||
      img.layerAiAnnotations.some(function(layer){ return Array.isArray(layer) && layer.length; }) ||
      img.layerMeasurements.some(function(layer){ return Array.isArray(layer) && layer.length; });
    if (hasTopLevelData && !hasLayerData) {
      img.layerAnnotations[baseLayer] = JSON.parse(JSON.stringify(img.annotations));
      img.layerAiAnnotations[baseLayer] = JSON.parse(JSON.stringify(img.aiAnnotations));
      img.layerMeasurements[baseLayer] = JSON.parse(JSON.stringify(img.measurements));
    }
    img.layerDataInitialized = true;
  }
  for (var layerIndex = 0; layerIndex < img.layerCount; layerIndex++) {
    if (!img.layerAnnotations[layerIndex]) img.layerAnnotations[layerIndex] = [];
    if (!img.layerAiAnnotations[layerIndex]) img.layerAiAnnotations[layerIndex] = [];
    if (!img.layerMeasurements[layerIndex]) img.layerMeasurements[layerIndex] = [];
  }
}

function loadLayerData(img, layerIndex) {
  ensureLayerStores(img);
  selectedAIAnnotationIndex = null;
  if (!img.layerCount || img.layerCount <= 1) {
    manualAnnotations = img.annotations;
    aiAnnotations = img.aiAnnotations;
    measurementResults = img.measurements;
    return;
  }
  if (!img.layerAnnotations[layerIndex]) img.layerAnnotations[layerIndex] = [];
  if (!img.layerAiAnnotations[layerIndex]) img.layerAiAnnotations[layerIndex] = [];
  if (!img.layerMeasurements[layerIndex]) img.layerMeasurements[layerIndex] = [];
  manualAnnotations = img.layerAnnotations[layerIndex];
  aiAnnotations = img.layerAiAnnotations[layerIndex];
  measurementResults = img.layerMeasurements[layerIndex];
  img.annotations = manualAnnotations;
  img.aiAnnotations = aiAnnotations;
  img.measurements = measurementResults;
}

  }
}

/* ============ IMAGE QUALITY GATE ============ */
function clampQualityScore(value) {
  return Math.max(0, Math.min(100, Math.round(value)));
}

function buildQualityAssessment(img, forceError) {
  if (!img) return null;
  if (forceError) {
    return {
      status: 'error',
      statusText: '分析失败',
      score: 0,
      metrics: { sharpness: 0, field: 0, exposure: 0, artifact: 0 },
      reasons: ['质量模型分析失败，请重新质控或更换影像'],
      model: getCurrentAIModel().name,
      assessedAt: new Date().toISOString()
    };
  }
  var base = 88 + (getCurrentAIModel().baseBias || 0);
  var reasons = [];
  var minDim = Math.min(img.width || 0, img.height || 0);
  var area = (img.width || 0) * (img.height || 0);
  var name = (img.name || '').toLowerCase();
  var sharpness = 86;
  var field = 88;
  var exposure = 84;
  var artifact = 90;

  if (minDim < QUALITY_GATE_MIN_DIMENSION) {
    var penalty = Math.ceil((QUALITY_GATE_MIN_DIMENSION - minDim) / 20);
    base -= 18 + penalty;
    sharpness -= 18 + penalty;
    field -= 8;
    reasons.push('影像分辨率偏低');
  }
  if (area < 500000) {
    base -= 8;
    field -= 10;
    reasons.push('有效视野不足');
  }
  if (img.syntheticPreview) {
    base -= 3;
    reasons.push('当前为模拟预览，建议导入原始影像后复核');
  }
  if (img.type === 'TIFF' || img.type === 'DICOM') {
    base -= 4;
    exposure -= 5;
  }
  if (name.indexOf('blur') >= 0 || name.indexOf('模糊') >= 0) {
    base -= 22;
    sharpness -= 30;
    reasons.push('检测到疑似模糊影像');
  }
  if (name.indexOf('fail') >= 0 || name.indexOf('失败') >= 0) {
    base -= 36;
    artifact -= 28;
    reasons.push('文件名提示采集失败或异常');
  }
  if (name.indexOf('dark') >= 0 || name.indexOf('欠曝') >= 0) {
    base -= 14;
    exposure -= 24;
    reasons.push('曝光不足');
  }
  if (name.indexOf('遮挡') >= 0 || name.indexOf('occlusion') >= 0) {
    base -= 18;
    field -= 24;
    reasons.push('存在疑似遮挡');
  }
  if (reasons.length === 0) reasons.push('图像质量符合AI分析要求');

  var score = clampQualityScore(base);
  var status = score >= QUALITY_GATE_PASS_SCORE ? 'pass' : score >= QUALITY_GATE_REVIEW_SCORE ? 'review' : 'fail';
  var statusText = status === 'pass' ? '质控通过' : status === 'review' ? '需人工复核' : '质控不通过';
  return {
    status: status,
    statusText: statusText,
    score: score,
    metrics: {
      sharpness: clampQualityScore(sharpness),
      field: clampQualityScore(field),
      exposure: clampQualityScore(exposure),
      artifact: clampQualityScore(artifact)
    },
    reasons: reasons,
    model: getCurrentAIModel().name,
    assessedAt: new Date().toISOString()
  };
}

function ensureQualityAssessment(img) {
  if (!img) return null;
  if (!img.qualityReport) img.qualityReport = buildQualityAssessment(img, false);
  return img.qualityReport;
}

function getCurrentAIModel() {
  for (var i = 0; i < AI_MODELS.length; i++) {
    if (AI_MODELS[i].id === currentAIModelId) return AI_MODELS[i];
  }
  return AI_MODELS[0];
}

function renderAIModelPanel() {
  var container = document.getElementById('aiModelPanel');
  if (!container) return;
  var current = getCurrentAIModel();
  var html = '<select onchange="setAIModel(this.value)">';

    html += '<option value="' + escapeLabelText(m.id) + '"' + sel + '>' + escapeLabelText(m.name) + '</option>';
  }
  html += '</select>';
  html += '<div style="font-size:10px;color:#889;line-height:1.4;margin-top:6px;">' + escapeLabelText(current.description) + '</div>';
  container.innerHTML = html;
}

function setAIModel(id) {
  var found = null;
  for (var i = 0; i < AI_MODELS.length; i++) {
    if (AI_MODELS[i].id === id) { found = AI_MODELS[i]; break; }
  }
  if (!found) return;
  var previousId = currentAIModelId;
  currentAIModelId = found.id;
  renderAIModelPanel();
  var needsReassess = previousId !== found.id;
  if (needsReassess && currentImageIndex >= 0 && uploadedImages[currentImageIndex]) {
    uploadedImages[currentImageIndex].qualityReport = null;
    runQualityAssessment(false);
  }
  document.getElementById('statusHint').textContent = '已切换至 AI 模型：' + found.name;
}

function initAIModelPanel() {
  renderAIModelPanel();
}

function runQualityAssessment(manual) {
  if (currentImageIndex < 0 || !uploadedImages[currentImageIndex]) {
    alert('请先选择影像');
    return;
  }
  var img = uploadedImages[currentImageIndex];
  document.getElementById('statusHint').textContent = '图像质量评估中...';
  setTimeout(function() {
    img.qualityReport = buildQualityAssessment(img, false);
    renderQualityGate();
    updateImageList();
    renderTabs();
    updateStatusPixelInfo(img);
    document.getElementById('statusHint').textContent = img.qualityReport.status === 'pass' ? '图像质量评估通过，可进入AI分析流程' : '图像质量未通过门控，请复核或重新采集';
    if (manual) alert('图像质量评估完成：' + img.qualityReport.statusText + '，评分 ' + img.qualityReport.score);
  }, 300);
}

/* ============ CANVAS SIZING ============ */
function updateCanvasSize() {
  if (currentImageIndex < 0) return;
  var cw = canvasContainer.clientWidth, ch = canvasContainer.clientHeight;
  var img = uploadedImages[currentImageIndex];
  var baseScale = Math.min(cw / img.width, ch / img.height, 1) * zoomLevel;
  var dw = Math.max(1, Math.round(img.width * baseScale));
  var dh = Math.max(1, Math.round(img.height * baseScale));
  var left = (cw - dw) / 2 + imageOffsetX;
  var top = (ch - dh) / 2 + imageOffsetY;
  imageLayer.style.width = dw + 'px';
  imageLayer.style.height = dh + 'px';
  imageLayer.style.position = 'absolute';
  imageLayer.style.left = left + 'px';
  imageLayer.style.top = top + 'px';
  annotationCanvas.width = dw;
  annotationCanvas.height = dh;
  annotationCanvas.style.width = dw + 'px';
  annotationCanvas.style.height = dh + 'px';
  annotationCanvas.style.left = left + 'px';
  annotationCanvas.style.top = top + 'px';
  annotationCanvas.style.position = 'absolute';
  annotationCanvas._scaleX = dw / img.width;
  annotationCanvas._scaleY = dh / img.height;
  applyViewerTransform();
  magCanvas.width = 150; magCanvas.height = 150;
  redraw();
}
window.addEventListener('resize', function() { if (currentImageIndex >= 0) updateCanvasSize(); });

function getLogicalCanvasRect() {
  var containerRect = canvasContainer.getBoundingClientRect();
  var left = parseFloat(annotationCanvas.style.left) || 0;
  var top = parseFloat(annotationCanvas.style.top) || 0;
  var width = parseFloat(annotationCanvas.style.width) || annotationCanvas.width;
  var height = parseFloat(annotationCanvas.style.height) || annotationCanvas.height;
  return {
    left: containerRect.left + canvasContainer.clientLeft + left,
    top: containerRect.top + canvasContainer.clientTop + top,
    width: width,
    height: height
  };
}

function getCanvasPos(e) {
  var rect = getLogicalCanvasRect();
  var scaleX = annotationCanvas._scaleX || 1;
  var scaleY = annotationCanvas._scaleY || 1;
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  var dx = e.clientX - cx;
  var dy = e.clientY - cy;
  var rad = -currentRotation * Math.PI / 180;
  var rx = dx * Math.cos(rad) - dy * Math.sin(rad);
  var ry = dx * Math.sin(rad) + dy * Math.cos(rad);
  if (flipHorizontal) rx = -rx;
  if (flipVertical) ry = -ry;
  return { x: (rx + rect.width / 2) / scaleX, y: (ry + rect.height / 2) / scaleY };
}

/* ============ ZOOM & PAN & ROTATE ============ */
function setZoom(v) {
  zoomLevel = v / 100;
  document.getElementById('zoomLabel').textContent = v;
  if (currentImageIndex >= 0) updateCanvasSize();
}
function zoomIn() { setZoom(Math.min(300, Math.round(zoomLevel*100)+10)); }
function zoomOut() { setZoom(Math.max(20, Math.round(zoomLevel*100)-10)); }
function resetZoom() { setZoom(100); }
function fitToView() { imageOffsetX = 0; imageOffsetY = 0; setZoom(100); }
function resetViewer() {
  zoomLevel = 1; currentRotation = 0; flipHorizontal = false; flipVertical = false;
  imageOffsetX = 0; imageOffsetY = 0; grayScale = 0; contrastLevel = 100; brightnessLevel = 100;
  document.getElementById('zoomLabel').textContent = '100';
  document.getElementById('graySlider').value = 0;
  document.getElementById('contrastSlider').value = 100;
  document.getElementById('brightnessSlider').value = 100;
  document.getElementById('btnFlipH').classList.remove('active');
  document.getElementById('btnFlipV').classList.remove('active');
  if (currentImageIndex >= 0) updateCanvasSize();
}

function togglePan() {
  var enable = !isPanning;
  resetExclusiveToolModes(enable ? 'pan' : '');
  isPanning = enable;
  clearExclusiveToolButtons(enable ? document.getElementById('btnPan') : null);
  document.getElementById('btnPan').classList.toggle('active', isPanning);
  annotationCanvas.style.cursor = isPanning ? 'grab' : 'crosshair';
  canvasContainer.style.cursor = isPanning ? 'grab' : 'default';
  updateCurrentToolStatus(isPanning ? '平移' : getToolName(activeTool));
}

function startPanDrag(e) {
  if (!isPanning || currentImageIndex < 0) return;
  isPanDragging = true;
  panStartX = e.clientX; panStartY = e.clientY;
  annotationCanvas.style.cursor = 'grabbing';
  canvasContainer.style.cursor = 'grabbing';
  e.preventDefault();
  e.stopPropagation();
}

function updatePanPosition(e) {
  if (!isPanDragging) return;
  var dx = e.clientX - panStartX, dy = e.clientY - panStartY;
  panStartX = e.clientX; panStartY = e.clientY;
  imageOffsetX += dx; imageOffsetY += dy;
  updateCanvasSize();
}

function endPanDrag() {
  if (!isPanDragging) return;
  isPanDragging = false;
  panStartX = undefined; panStartY = undefined;
  annotationCanvas.style.cursor = isPanning ? 'grab' : 'crosshair';
  canvasContainer.style.cursor = isPanning ? 'grab' : 'default';
}

function panImage(dx, dy) {
  if (currentImageIndex < 0) return;
  imageOffsetX += dx;
  imageOffsetY += dy;
  updateCanvasSize();
}

function rotateImage() {
  currentRotation = (currentRotation + 90) % 360;
  applyViewerTransform();
  redraw();
}

function flipImage(axis) {
  if (axis === 'h') {
    flipHorizontal = !flipHorizontal;
    document.getElementById('btnFlipH').classList.toggle('active', flipHorizontal);
  } else {
    flipVertical = !flipVertical;
    document.getElementById('btnFlipV').classList.toggle('active', flipVertical);
  }
  applyViewerTransform();
  redraw();
}

function toggleWindowLevel() {
  var enable = !windowLevelMode;
  resetExclusiveToolModes(enable ? 'window' : '');
  windowLevelMode = enable;
  clearExclusiveToolButtons(enable ? document.getElementById('btnWL') : null);
  document.getElementById('btnWL').classList.toggle('active', windowLevelMode);
  annotationCanvas.style.cursor = windowLevelMode ? 'ns-resize' : 'crosshair';
  updateCurrentToolStatus(windowLevelMode ? '窗宽窗位' : getToolName(activeTool));
}

function setGrayScale(v) { grayScale = parseInt(v, 10) || 0; applyViewerTransform(); }
function setContrast(v) { contrastLevel = parseInt(v, 10) || 100; applyViewerTransform(); }
function setBrightness(v) { brightnessLevel = parseInt(v, 10) || 100; applyViewerTransform(); }

function applyViewerTransform() {
  var transform = 'rotate(' + currentRotation + 'deg) scale(' + (flipHorizontal ? -1 : 1) + ',' + (flipVertical ? -1 : 1) + ')';
  var filter = 'grayscale(' + grayScale + '%) contrast(' + contrastLevel + '%) brightness(' + brightnessLevel + '%)';
  imageLayer.style.transformOrigin = 'center center';
  annotationCanvas.style.transformOrigin = 'center center';
  imageLayer.style.transform = transform;
  annotationCanvas.style.transform = transform;
  imageLayer.style.filter = filter;
}

function switchOCTLayer(val) {

function updateOCTPlaybackButton() {

  setLayerControlsEnabled(false);
  document.getElementById('octSlider').min = 0;
  document.getElementById('octSlider').max = 0;

function prevOCTLayer() {
  if (octLayers.length === 0) { resetLayerControls('当前没有可切换的多层影像'); return; }
  switchOCTLayer(currentOCTIndex - 1);

function nextOCTLayer() {
  if (octLayers.length === 0) { resetLayerControls('当前没有可切换的多层影像'); return; }
  switchOCTLayer(currentOCTIndex + 1);

function getOCTPlayIntervalMs() {
  var select = document.getElementById('octPlaySpeedSelect');

}

function changeOCTPlaySpeed() {
  if (!octPlayInterval) return;
  stopOCT();
  playOCT();
}

function toggleOCTPlayback() {
  if (octPlayInterval) stopOCT();

}

function playOCT() {
  if (octLayers.length === 0) { resetLayerControls('当前没有可播放的多层影像'); return; }
  if (octPlayInterval) return;
  octPlayInterval = setInterval(function() {
    switchOCTLayer((currentOCTIndex + 1) % octLayers.length);

function stopOCT() {
  clearInterval(octPlayInterval);
  octPlayInterval = null;

/* ============ TOOL SWITCHING ============ */
function clearExclusiveToolButtons(keepButton) {
  var buttons = document.querySelectorAll('.toolbar .tool-btn[data-tool], #btnAnnotation, #btnMagnifier, #btnProbe, #btnEraser, #btnPan, #btnWL');
  for (var i = 0; i < buttons.length; i++) {
    if (buttons[i] !== keepButton) buttons[i].classList.remove('active');
  }
}

function cancelTransientDrawingState() {
  if (!isDrawing && polygonPoints.length === 0 && brushPath.length === 0 && measurePoints.length === 0 && !pendingNotePoint) return;
  isDrawing = false;
  polygonPoints = [];
  brushPath = [];
  measurePoints = [];
  pendingNotePoint = null;
  redraw();
}

function cancelAngleMeasurement() {
  if (activeTool !== 'measure-angle' || measurePoints.length === 0) return;
  isDrawing = false;
  measurePoints = [];
  redraw();
  document.getElementById('statusHint').textContent = '已取消当前角度测量';
}

function resetExclusiveToolModes(keepMode) {
  cancelTransientDrawingState();
  if (keepMode !== 'annotation') annotationMode = false;
  if (keepMode !== 'magnifier') magnifierEnabled = false;
  if (keepMode !== 'probe') probeEnabled = false;
  if (keepMode !== 'eraser') eraserEnabled = false;
  if (keepMode !== 'pan') {
    if (isPanDragging) endPanDrag();
    isPanning = false;
  }
  if (keepMode !== 'window') windowLevelMode = false;
  if (keepMode !== 'probe') document.getElementById('probeInfo').style.display = 'none';
  if (keepMode !== 'magnifier') document.getElementById('magnifier').style.display = 'none';
  if (keepMode !== 'pan') canvasContainer.style.cursor = 'default';
}

function setTool(tool, btn) {
  if (activeTool === 'polygon' && tool !== 'polygon' && polygonPoints.length > 0) {
    polygonPoints = [];
    isDrawing = false;
    redraw();
  }
  activeTool = tool;
  resetExclusiveToolModes('');
  clearExclusiveToolButtons(btn);
  if (btn) btn.classList.add('active');
  annotationCanvas.style.cursor = 'crosshair';
  updateCurrentToolStatus(getToolName(tool));
  document.getElementById('statusHint').textContent = '当前工具: ' + getToolName(tool);

function updateCurrentToolStatus(name) {

function getToolName(tool) {
  var names = {
    select:'选择', rect:'矩形勾画', polygon:'多边形勾画', brush:'画笔勾画', fill:'区域填充', ellipse:'椭圆勾画', line:'线段勾画',
    'measure-length':'长度测量', 'measure-angle':'角度测量', 'measure-area':'面积测量', 'measure-ellipse':'椭圆测量', 'measure-rect':'矩形测量'
  };

}

/* ============ LABEL & CATEGORY ============ */
function loadTaskLabelSetPresets() {
  var taskId = getQueryParam('taskId');
  activeTaskContext = null;
  activeTaskLabelSet = null;
  activeTaskLabelSets = [];
  annotationLabelSets = [];
  annotationDiseases = [];
  try {
    annotationLabelSets = JSON.parse(localStorage.getItem('life_med_annotation_label_sets') || '[]');
    annotationDiseases = JSON.parse(localStorage.getItem('life_med_annotation_diseases') || '[]');
    if (!Array.isArray(annotationLabelSets)) annotationLabelSets = [];
    if (!Array.isArray(annotationDiseases)) annotationDiseases = [];
  } catch (e) {
    annotationLabelSets = [];
    annotationDiseases = [];
  }
  if (!taskId) {
    LABEL_PRESETS = DEFAULT_LABEL_PRESETS.slice();
    return;
  }
  try {
    var tasks = JSON.parse(localStorage.getItem('life_med_annotation_tasks') || '[]');
    var task = null;
    for (var i = 0; i < tasks.length; i++) {
      if (tasks[i] && tasks[i].id === taskId) {
        task = tasks[i];
        break;
      }
    }
    if (!task) {
      LABEL_PRESETS = DEFAULT_LABEL_PRESETS.slice();
      return;
    }
    activeTaskContext = task;
    if (!task.labelSet) {
      LABEL_PRESETS = DEFAULT_LABEL_PRESETS.slice();
      return;
    }
    var labelSet = null;
    for (var j = 0; j < annotationLabelSets.length; j++) {
      if (annotationLabelSets[j] && annotationLabelSets[j].id === task.labelSet) {
        labelSet = annotationLabelSets[j];
        break;
      }
    }
    if (!labelSet || !labelSet.labels || !labelSet.labels.length) {
      LABEL_PRESETS = DEFAULT_LABEL_PRESETS.slice();
      return;
    }
    var mapped = [];
    for (var k = 0; k < labelSet.labels.length; k++) {
      var item = labelSet.labels[k];
      if (!item || item.enabled === false || !item.name) continue;
      mapped.push({
        label:item.name,
        color:item.color || '#A78BFA',
        category:item.type || '标签'
      });
    }
    LABEL_PRESETS = mapped.length ? mapped : DEFAULT_LABEL_PRESETS.slice();
    activeTaskLabelSet = labelSet;
    activeTaskLabelSets = labelSet ? [labelSet] : [];
  } catch (e) {
    LABEL_PRESETS = DEFAULT_LABEL_PRESETS.slice();
    activeTaskLabelSets = [];
  }
}

function getDiseaseIdsForDiagnosisName(name) {
  var ids = [];
  var normalizedName = String(name || '');
  for (var i = 0; i < annotationDiseases.length; i++) {
    var disease = annotationDiseases[i];
    if (!disease || disease.status === '停用') continue;
    var names = [disease.name].concat(disease.aliases || []);
    if (disease.name === '黄斑病变') names = names.concat(['年龄相关性黄斑变性', 'AMD']);
    for (var j = 0; j < names.length; j++) {
      if (names[j] && (names[j] === normalizedName || normalizedName.indexOf(names[j]) >= 0 || String(names[j]).indexOf(normalizedName) >= 0)) {
        ids.push(disease.id);
        break;
      }
    }
  }
  return ids;
}

function getDiseaseCategoryTemplate(name) {
  var normalizedName = String(name || '');
  for (var i = 0; i < DISEASE_CATEGORIES.length; i++) {
    var cat = DISEASE_CATEGORIES[i];
    if (!cat || !cat.name) continue;
    if (cat.name === normalizedName || normalizedName.indexOf(cat.name) >= 0 || cat.name.indexOf(normalizedName) >= 0) return cat;
    if (cat.name === '年龄相关性黄斑变性' && (normalizedName === '黄斑病变' || normalizedName.indexOf('黄斑') >= 0)) return cat;
  }
  return null;
}

function buildDiseaseCategoryFromRecord(disease) {
  var template = getDiseaseCategoryTemplate(disease && disease.name);
  return {
    id: disease && disease.id ? disease.id : '',
    name: disease && disease.name ? disease.name : '',
    levels: template && template.levels ? template.levels.slice() : DEFAULT_DISEASE_LEVELS.slice()
  };
}

function getAvailableDiseaseCategories() {
  var categories = [];
  var seen = {};
  for (var i = 0; i < annotationDiseases.length; i++) {
    var disease = annotationDiseases[i];
    if (!disease || !disease.name || seen[disease.name]) continue;
    categories.push(buildDiseaseCategoryFromRecord(disease));
    seen[disease.name] = true;
  }
  return categories;
}

function mapLabelSetToPresets(labelSet) {
  if (!labelSet || !labelSet.labels || !labelSet.labels.length) return [];
  var mapped = [];
  for (var i = 0; i < labelSet.labels.length; i++) {
    var item = labelSet.labels[i];
    if (!item || item.enabled === false || !item.name) continue;
    mapped.push({
      label: item.name,
      color: item.color || '#A78BFA',
      category: item.type || '标签'
    });
  }
  return mapped;
}

function mapLabelSetsToPresets(labelSets) {
  var mapped = [];
  var seen = {};
  for (var i = 0; i < labelSets.length; i++) {
    var presets = mapLabelSetToPresets(labelSets[i]);
    for (var j = 0; j < presets.length; j++) {
      var item = presets[j];
      if (!item || !item.label || seen[item.label]) continue;
      mapped.push(item);
      seen[item.label] = true;
    }
  }
  return mapped;
}

function getLabelSetDiseaseIds(labelSet) {
  return Array.isArray(labelSet && labelSet.diseases) ? labelSet.diseases : [];
}

function getDiagnosisResultsForLabelSetMatch() {
  var results = [];
  function append(list) {
    if (!list || !list.length) return;
    for (var i = 0; i < list.length; i++) {
      if (list[i] && list[i].disease) results.push(list[i]);
    }
  }
  append(manualDiagnosisResult);
  append(aiDiagnosisResult);
  return results;
}

function findLabelSetsForSelectedDiseases() {
  var diagnosisResults = getDiagnosisResultsForLabelSetMatch();
  if (!diagnosisResults.length) return [];
  var diseaseIds = [];
  var selectedDiseaseIdMap = {};
  for (var i = 0; i < diagnosisResults.length; i++) {
    var result = diagnosisResults[i];
    diseaseIds = diseaseIds.concat(getDiseaseIdsForDiagnosisName(result.disease));
  }
  for (var d = 0; d < diseaseIds.length; d++) {
    if (diseaseIds[d]) selectedDiseaseIdMap[diseaseIds[d]] = true;
  }
  var matched = [];
  var matchedIds = {};
  for (var j = 0; j < annotationLabelSets.length; j++) {
    var labelSet = annotationLabelSets[j];
    if (!labelSet) continue;
    var linkedDiseases = getLabelSetDiseaseIds(labelSet);
    for (var k = 0; k < diseaseIds.length; k++) {
      if (linkedDiseases.indexOf(diseaseIds[k]) >= 0 && !matchedIds[labelSet.id]) {
        matched.push(labelSet);
        matchedIds[labelSet.id] = true;
        break;
      }
    }
  }
  if (!matched.length && activeTaskContext && activeTaskContext.labelSet) {
    for (var t = 0; t < annotationLabelSets.length; t++) {
      var taskLabelSet = annotationLabelSets[t];
      if (taskLabelSet && taskLabelSet.id === activeTaskContext.labelSet) {
        var taskLinkedDiseases = getLabelSetDiseaseIds(taskLabelSet);
        for (var m = 0; m < taskLinkedDiseases.length; m++) {
          if (selectedDiseaseIdMap[taskLinkedDiseases[m]]) return [taskLabelSet];
        }
      }
    }
  }
  return matched;
}

function refreshLabelSetBySelectedDisease() {
  var labelSets = findLabelSetsForSelectedDiseases();
  var hasSelectedDisease = getDiagnosisResultsForLabelSetMatch().length > 0;
  if (!labelSets.length) {
    activeTaskLabelSet = null;
    activeTaskLabelSets = [];
    LABEL_PRESETS = hasSelectedDisease ? [] : DEFAULT_LABEL_PRESETS.slice();
  } else {
    activeTaskLabelSet = labelSets[0];
    activeTaskLabelSets = labelSets.slice();
    LABEL_PRESETS = mapLabelSetsToPresets(labelSets);
  }
  if (currentLabel !== PENDING_LABEL) {
    var exists = LABEL_PRESETS.some(function (item) { return item.label === currentLabel; });
    if (!exists) {
      currentLabel = PENDING_LABEL;
      currentColor = PENDING_COLOR;
    }
  }
  initLabelPresets();
  updateUI();
}

function getQueryParam(name) {
  try {
    var params = new URLSearchParams(window.location.search || '');
    return params.get(name) || '';
  } catch (e) {
    return '';
  }
}

function initLabelPresets() {

    initCategoryManager();
    return;
  }
  var selectedLabel = currentLabel === PENDING_LABEL ? '' : currentLabel;

  html += '<option value="">全部标签</option>';

function selectPreset(label, color, el) {

function applyLabelDropdown(label) {

function filterLabelOptions() {

function addCustomLabel() {

  var val = input.value.trim();

  var exists = false;
  for (var i = 0; i < LABEL_PRESETS.length; i++) {

function syncLabelDropdown() {
  var select = document.getElementById('labelPresetSelect');
  if (!select) return;
  var label = currentLabel === PENDING_LABEL ? '' : currentLabel;
  if (selectedAnnotationId) {
    var selectedAnno = findAnno(selectedAnnotationId);

  }

}

function getCurrentLabelOptions() {
  return LABEL_PRESETS.filter(function (preset) {
    return preset && preset.label;
  });
}

function getClassificationFromExamResult(value) {
  if (value === '正常') return '正常';
  if (value === '异常') return '异常';
  if (value === '需重新采集') return '需重新采集';
  return '';
}

function isLegacyClassificationLabel(value) {
  return value === '正常' || value === '异常' || value === '需重新采集' || value === '待分类';
}

function appendDiseaseLabelValue(value, labels, seen) {
  if (!value || isLegacyClassificationLabel(value)) return;
  var parts = String(value).split(/[、,，;；]/);
  for (var i = 0; i < parts.length; i++) {
    var name = parts[i].trim();
    if (!name || isLegacyClassificationLabel(name) || seen[name]) continue;
    labels.push(name);
    seen[name] = true;
  }
}

function appendDiagnosisDiseaseLabels(list, labels, seen) {
  if (!list || !list.length) return;
  for (var i = 0; i < list.length; i++) {
    if (list[i] && list[i].disease) appendDiseaseLabelValue(list[i].disease, labels, seen);
  }
}

function getImageDiseaseLabels(img) {
  var labels = [];
  var seen = {};
  if (!img) return labels;
  if (currentImageIndex >= 0 && uploadedImages[currentImageIndex] === img) {
    appendDiagnosisDiseaseLabels(manualDiagnosisResult, labels, seen);
    appendDiagnosisDiseaseLabels(aiDiagnosisResult, labels, seen);
  } else {
    appendDiagnosisDiseaseLabels(img.manualDiagnosisResult, labels, seen);
    appendDiagnosisDiseaseLabels(img.aiDiagnosisResult, labels, seen);
  }
  return labels;
}

function hasImageDiseaseLabel(img, label) {
  var labels = getImageDiseaseLabels(img);
  return labels.indexOf(label) >= 0;
}

function getImageClassificationLabel(img) {
  if (!img) return '';
  return getClassificationFromExamResult(img.classificationLabel) || getClassificationFromExamResult(img.examResult);
}

function getImageClassificationDisplay(img) {
  var diseaseLabels = getImageDiseaseLabels(img);
  if (diseaseLabels.length) return diseaseLabels.join('、');
  return getImageClassificationLabel(img) || '待分类';
}

function getCurrentImageClassification() {
  if (currentImageIndex < 0 || !uploadedImages[currentImageIndex]) return '';
  return getImageClassificationLabel(uploadedImages[currentImageIndex]);
}

function initImageClassificationManager() {
  var container = document.getElementById('imageClassificationManager');
  if (!container) return;
  var selected = getCurrentImageClassification();
  var normalActive = selected === '正常';
  var recaptureActive = selected === '需重新采集';

    '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +

    '</div>' +
    '<div style="font-size:10px;color:#889;margin-top:6px;line-height:1.4;">“正常”为未见异常，“需重新采集”为图像质量不满足判读；具体疾病请在下方“疾病分类”中标注。</div>';

function setImageClassification(label) {

function initCategoryManager() {
  var container = document.getElementById('categoryManager');
  if (!container) return;
  var searchInput = document.getElementById('diseaseCategorySearchInput');
  var keyword = searchInput ? searchInput.value.trim() : '';
  var categories = getAvailableDiseaseCategories();
  var selectedNames = {};
  if (manualDiagnosisResult && manualDiagnosisResult.length) {
    for (var s = 0; s < manualDiagnosisResult.length; s++) {
      if (manualDiagnosisResult[s] && manualDiagnosisResult[s].disease) selectedNames[manualDiagnosisResult[s].disease] = true;
    }
  }
  var html = '<input type="text" id="diseaseCategorySearchInput" placeholder="搜索疾病分类" value="' + escapeLabelText(keyword) + '" oninput="filterDiseaseCategoryOptions()">' +
    '<select id="diseaseCategorySelect" onchange="addDiagnosisCategoryFromDropdown(this.value)">' +
    '<option value="">选择疾病分类</option>';
  var resultHtml = '<div class="disease-search-results">';
  var resultCount = 0;
  for (var i = 0; i < categories.length; i++) {
    var cat = categories[i];
    if (selectedNames[cat.name]) continue;
    if (!keyword || cat.name.indexOf(keyword) < 0) continue;
    html += '<option value="' + i + '">' + escapeLabelText(cat.name) + '</option>';
    resultHtml += '<button type="button" class="disease-search-result" onclick="addDiagnosisCategoryFromDropdown(' + i + ')">' + escapeLabelText(cat.name) + '</button>';
    resultCount++;
  }
  html += '</select>';
  if (keyword && categories.length && resultCount) {
    html += resultHtml + '</div>';
  } else if (keyword && categories.length) {
    html += '<div class="disease-search-empty">未找到匹配的疾病分类，或分类已全部选择</div>';
  }
  if (!categories.length) html += '<div style="font-size:10px;color:#889;line-height:1.4;margin-top:6px;">暂无可选疾病，请先在标签/疾病管理中维护疾病。</div>';
  if (manualDiagnosisResult && manualDiagnosisResult.length) {
    html += '<div class="selected-disease-list">';
    for (var j = 0; j < manualDiagnosisResult.length; j++) {
      var item = manualDiagnosisResult[j];
      if (!item || !item.disease) continue;
      html += '<div class="selected-disease-tag"><span>' + escapeLabelText(item.disease) + '</span><button type="button" onclick="removeManualDiagnosisCategory(' + j + ')" title="移除">×</button></div>';

      filterDiseaseCategoryOptions();
    });

function updateDiagnosisCategories() {
  saveAnalysisResults();
  refreshLabelSetBySelectedDisease();
  updateAnalysisActionLabels();
  initImageClassificationManager();
  initCategoryManager();
  updateImageList();
  renderTabs();
  if (currentImageIndex >= 0 && uploadedImages[currentImageIndex]) updateStatusPixelInfo(uploadedImages[currentImageIndex]);
  document.getElementById('statusHint').textContent = '已更新人工疾病分类，可在右侧选择病情程度';
}

function getSelectedDiagnosisCategories() {
  var selected = getCheckedDiagnosisCategories();
  return selected.length ? selected : getAvailableDiseaseCategories();
}

function restoreDiagnosisCategoryChecksFromManual() {
  initImageClassificationManager();
  refreshLabelSetBySelectedDisease();
}

function getCheckedDiagnosisCategories() {
  var selected = [];
  if (!manualDiagnosisResult) manualDiagnosisResult = [];
  var categories = getAvailableDiseaseCategories();
  for (var i = 0; i < categories.length; i++) {
    for (var j = 0; j < manualDiagnosisResult.length; j++) {
      if (manualDiagnosisResult[j] && manualDiagnosisResult[j].disease === categories[i].name) {
        selected.push(categories[i]);
        break;
      }
    }
  }
  return selected;
}

function filterDiseaseCategoryOptions() {
  if (isDiseaseSearchComposing) return;
  initCategoryManager();
  var input = document.getElementById('diseaseCategorySearchInput');
  if (input) {
    input.focus();
    var len = input.value.length;
    try { input.setSelectionRange(len, len); } catch (e) {}
  }
}

function addDiagnosisCategoryFromDropdown(value) {
  if (value === '') return;
  var idx = parseInt(value, 10);
  var cat = getAvailableDiseaseCategories()[idx];
  if (!cat) return;
  if (!manualDiagnosisResult) manualDiagnosisResult = [];
  for (var i = 0; i < manualDiagnosisResult.length; i++) {
    if (manualDiagnosisResult[i] && manualDiagnosisResult[i].disease === cat.name) {
      initCategoryManager();
      return;
    }
  }
  manualDiagnosisResult.push({
    disease: cat.name,
    level: '',
    allLevels: cat.levels.slice(),
    source: 'manual',
    manuallyCorrected: true
  });
  updateDiagnosisCategories();
}

function toggleManualDiagnosisDisease(diseaseName) {
  if (!diseaseName) return;
  var categories = getAvailableDiseaseCategories();
  var matched = null;
  for (var c = 0; c < categories.length; c++) {
    if (categories[c] && categories[c].name === diseaseName) {
      matched = categories[c];
      break;
    }
  }
  if (!matched) return;
  if (!manualDiagnosisResult) manualDiagnosisResult = [];
  for (var i = 0; i < manualDiagnosisResult.length; i++) {
    if (manualDiagnosisResult[i] && manualDiagnosisResult[i].disease === diseaseName) {
      manualDiagnosisResult.splice(i, 1);
      return;
    }
  }
  manualDiagnosisResult.push({
    disease: matched.name,
    level: '',
    allLevels: matched.levels.slice(),
    source: 'manual',
    manuallyCorrected: true
  });
}

function removeManualDiagnosisCategory(index) {
  if (!manualDiagnosisResult || !manualDiagnosisResult[index]) return;
  var removed = manualDiagnosisResult[index].disease;
  manualDiagnosisResult.splice(index, 1);
  updateDiagnosisCategories();
  document.getElementById('statusHint').textContent = '已移除人工疾病分类: ' + removed;
}

function renderManualDiagnosisDisplay() {
  var container = document.getElementById('manualDiagnosisResults');
  if (!container) return;
  if (!manualDiagnosisResult || !manualDiagnosisResult.length) {
    container.innerHTML = '<div class="measurement-info">未选择人工疾病分类</div>';
    return;
  }
  var html = '<span class="scope-label">人工诊断分类</span>';
  for (var i = 0; i < manualDiagnosisResult.length; i++) {
    var r = manualDiagnosisResult[i];
    html += '<div class="result-card-mini manual-diagnosis-card" style="border-left-color:#A78BFA;">' +
      '<div class="rc-title">' + escapeLabelText(r.disease) + '<span class="manual-tag">人工</span></div>' +
      '<div class="rc-val">' + escapeLabelText(r.level || '未分级') + '</div>' +
      '<div style="margin-top:3px;">';
    for (var j = 0; j < r.allLevels.length; j++) {
      var level = r.allLevels[j];
      var selectedClass = level === r.level ? 'selected' : '';
      html += '<span class="diagnosis-tag ' + selectedClass + '" style="background:' + (level === r.level ? '#A78BFA':'#363652') + ';" onclick="selectManualDiagnosisLevel(' + i + ',' + j + ')">' + escapeLabelText(level) + '</span>';
    }

function selectManualDiagnosisLevel(diseaseIdx, levelIdx) {
  if (!manualDiagnosisResult || !manualDiagnosisResult[diseaseIdx]) return;
  var result = manualDiagnosisResult[diseaseIdx];
  result.level = result.allLevels[levelIdx];

/* ============ ANNOTATION DRAWING ============ */
var isDrawing = false;
var drawStartX, drawStartY, drawCurrentX, drawCurrentY;
var polygonPoints = [];
var brushPath = [];
var measurePoints = [];
var pendingNotePoint = null;
var annotationLabelBounds = {};
var isLabelDragging = false;
var labelDragAnnotationId = null;
var labelDragOffsetX = 0, labelDragOffsetY = 0;
var labelDragChanged = false;
var labelDragSnapshot = null;
var isErasing = false;
var eraserChanged = false;
var eraserBeforeSnapshot = null;
var currentEraserRadius = 12;

function addPendingManualAnnotation(annotation) {
  annotation.id = annotationIdCounter++;
  annotation.label = PENDING_LABEL;
  annotation.color = PENDING_COLOR;
  annotation.source = annotation.source || 'manual';
  manualAnnotations.push(annotation);
  selectedAnnotationId = annotation.id;
  currentLabel = PENDING_LABEL;
  currentColor = PENDING_COLOR;
  return annotation;
}

canvasContainer.addEventListener('mousedown', function(e) {
  startPanDrag(e);
}, true);

annotationCanvas.addEventListener('mousedown', function(e) {
  var pos = getCanvasPos(e);
  if (isPanning) return;
  if (windowLevelMode) { windowDragActive = true; windowStartX = e.clientX; windowStartY = e.clientY; return; }
  if (magnifierEnabled) { updateMagnifier(e); return; }
  if (probeEnabled) {
    if (!canUseAIForCurrentImage('探针标记')) return;
    placeProbe(pos, e);
    return;
  }
  if (eraserEnabled) { startEraserStroke(pos.x, pos.y); return; }
  if (annotationMode) {
    if (currentImageIndex < 0) return;
    if (!canUseAIForCurrentImage('人工注释')) return;
    pendingNotePoint = [pos.x, pos.y];
    redraw();
    document.getElementById('statusHint').textContent = '已选择注释位置，请填写阅片说明';
    requestAnimationFrame(function() {
      setTimeout(function() {
        var note = prompt('请输入阅片注释');
        if (note && note.trim()) {
          pushUndo();
          manualAnnotations.push({ id: annotationIdCounter++, type: 'note', label: note.trim(), color: '#FFD700', source: 'manual', point: [pos.x, pos.y], lineWidth: 1 });
          saveAnnotations();
          updateUI();
        }
        pendingNotePoint = null;
        redraw();
      }, 0);
    });
    return;
  }
  if (activeTool === 'select' || activeTool === 'select-anno') {
    if (startLabelDrag(pos)) return;
    selectedAnnotationId = hitTestAnno(pos.x, pos.y);
    if (selectedAnnotationId) selectedAIAnnotationIndex = null;
    updateUI(); redraw(); return;
  }
  if (activeTool === 'delete') {
    var hit = hitTestAnno(pos.x, pos.y);
    if (hit) { pushUndo(); manualAnnotations = manualAnnotations.filter(function(a){return a.id!==hit;}); selectedAnnotationId=null; saveAnnotations(); redraw(); updateUI(); }
    return;
  }
  if (currentImageIndex < 0) return;
  if (!canUseAIForCurrentImage('人工标注与测量')) return;
  if (activeTool === 'measure-angle') {
    handleAngleMeasurementClick(pos);
    return;
  }
  isDrawing = true;
  drawStartX = pos.x; drawStartY = pos.y;
  drawCurrentX = pos.x; drawCurrentY = pos.y;
  if (activeTool === 'polygon') {
    if (polygonPoints.length >= 3 && distanceBetweenPoints(pos, { x: polygonPoints[0][0], y: polygonPoints[0][1] }) <= 10) {
      finishPolygon();
      return;
    }
    polygonPoints.push([pos.x, pos.y]);
    document.getElementById('statusHint').textContent = '多边形绘制中 - 双击、按 Enter 或点击起点结束，Esc 取消';
  }
  else if (activeTool === 'brush' || activeTool === 'fill') {
    brushPath = [[pos.x, pos.y]];
    if (activeTool === 'fill') {
      document.getElementById('statusHint').textContent = '区域填充中 - 按住拖拽圈出区域，松开完成';
    }
  }
  else if (activeTool === 'measure-length' || activeTool === 'measure-area') {
    brushPath = [[pos.x, pos.y]];
    measurePoints = [[pos.x, pos.y]];
  }
  redraw();
});

annotationCanvas.addEventListener('mousemove', function(e) {
  if (windowDragActive) {
    var dxWL = e.clientX - windowStartX;
    var dyWL = e.clientY - windowStartY;
    contrastLevel = Math.max(50, Math.min(180, 100 + dxWL));
    brightnessLevel = Math.max(50, Math.min(160, 100 - dyWL));
    document.getElementById('contrastSlider').value = contrastLevel;
    document.getElementById('brightnessSlider').value = brightnessLevel;
    applyViewerTransform();
    return;
  }
  if (isPanDragging) return;
  if (isLabelDragging) {
    moveLabelDrag(getCanvasPos(e));
    return;
  }
  if (isErasing) {
    var eraserPos = getCanvasPos(e);
    applyEraserAt(eraserPos.x, eraserPos.y);
    redraw();
    return;
  }
  if (magnifierEnabled) { updateMagnifier(e); }
  if (probeEnabled) { updateProbe(e); }
  var pos = getCanvasPos(e);
  if (!isDrawing) {
    if ((activeTool === 'select' || activeTool === 'select-anno') && isSelectedLabelHit(pos)) {
      annotationCanvas.style.cursor = 'move';
    } else if (activeTool === 'select' || activeTool === 'select-anno') {
      annotationCanvas.style.cursor = 'crosshair';
    }
    return;
  }
  drawCurrentX = pos.x; drawCurrentY = pos.y;
  if (activeTool === 'brush' || activeTool === 'fill') brushPath.push([pos.x, pos.y]);
  if (activeTool === 'measure-length' || activeTool === 'measure-area') {
    measurePoints.push([pos.x, pos.y]);
  }
  redraw();
});

function finishPolygon() {
  if (activeTool !== 'polygon' || polygonPoints.length < 3) return;
  isDrawing = false;
  pushUndo();
  addPendingManualAnnotation({
    type: 'polygon', points: polygonPoints.slice(), lineWidth: currentLineWidth
  });
  polygonPoints = [];
  saveAnnotations();
  redraw(); updateUI();
  document.getElementById('statusHint').textContent = '多边形已完成，请在下拉列表选择标签';
}

function cancelPolygon() {
  if (activeTool !== 'polygon' || polygonPoints.length === 0) return;
  isDrawing = false;
  polygonPoints = [];
  redraw();
  document.getElementById('statusHint').textContent = '已取消当前多边形';
}

function distanceBetweenPoints(p1, p2) {
  var dx = p1.x - p2.x, dy = p1.y - p2.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function handleAngleMeasurementClick(pos) {
  measurePoints.push([pos.x, pos.y]);
  drawCurrentX = pos.x;
  drawCurrentY = pos.y;
  isDrawing = measurePoints.length > 0 && measurePoints.length < 3;
  if (measurePoints.length === 1) {
    document.getElementById('statusHint').textContent = '角度测量：已选择第1点，请点击角点';
    redraw();
    return;
  }
  if (measurePoints.length === 2) {
    document.getElementById('statusHint').textContent = '角度测量：已选择角点，请点击另一端点';
    redraw();
    return;
  }
  var angle = calcAngle(measurePoints[0], measurePoints[1], measurePoints[2]);
  addMeasurement('angle', angle, measurePoints.slice(0, 3));
  measurePoints = [];
  isDrawing = false;
  redraw();
  updateUI();
  document.getElementById('statusHint').textContent = '角度测量完成：' + angle.toFixed(1) + '°';
}

annotationCanvas.addEventListener('dblclick', function(e) {
  if (activeTool === 'polygon') {
    e.preventDefault();
    finishPolygon();
  }
});

annotationCanvas.addEventListener('mouseup', function(e) {
  if (isPanDragging) { endPanDrag(); return; }
  if (windowDragActive) { windowDragActive = false; return; }
  if (isLabelDragging) { endLabelDrag(); return; }
  if (isErasing) { endEraserStroke(); return; }
  if (!isDrawing) return;
  if (activeTool === 'polygon') return;
  if (activeTool === 'measure-angle') return;
  isDrawing = false;
  var pos = getCanvasPos(e);
  drawCurrentX = pos.x; drawCurrentY = pos.y;
  var x1 = Math.min(drawStartX, drawCurrentX), y1 = Math.min(drawStartY, drawCurrentY);
  var w = Math.abs(drawCurrentX - drawStartX), h = Math.abs(drawCurrentY - drawStartY);
  if (activeTool === 'rect') {
    if (w > 3 && h > 3) {
      pushUndo();
      addPendingManualAnnotation({ type: 'rect', bbox: [x1,y1,w,h], lineWidth: currentLineWidth });
    }
  } else if (activeTool === 'measure-rect') {
    if (w > 3 && h > 3) addMeasurement('rect', w * h, [x1,y1,w,h]);
  } else if (activeTool === 'ellipse') {
    if (w > 3 && h > 3) {
      pushUndo();
      addPendingManualAnnotation({ type: 'ellipse', bbox: [x1,y1,w,h], lineWidth: currentLineWidth });
    }
  } else if (activeTool === 'measure-ellipse') {
    if (w > 3 && h > 3) addMeasurement('ellipse', Math.PI * (w/2) * (h/2), [x1,y1,w,h]);
  } else if (activeTool === 'line') {
    var lineLen = Math.sqrt(Math.pow(drawCurrentX-drawStartX,2)+Math.pow(drawCurrentY-drawStartY,2));
    if (lineLen > 3) {
      pushUndo();
      addPendingManualAnnotation({ type: 'line', points: [[drawStartX,drawStartY],[drawCurrentX,drawCurrentY]], lineWidth: currentLineWidth });
    }
  } else if (activeTool === 'measure-length') {
    var len = Math.sqrt(Math.pow(drawCurrentX-drawStartX,2)+Math.pow(drawCurrentY-drawStartY,2));
    addMeasurement('length', len, [drawStartX,drawStartY,drawCurrentX,drawCurrentY]);
  } else if (activeTool === 'measure-area' || activeTool === 'measure-polygon') {
    if (measurePoints.length >= 3) {
      var area = calcPolygonArea(measurePoints);
      addMeasurement('area', area, measurePoints.slice());
      measurePoints = [];
    }
  } else if (activeTool === 'brush') {
    if (brushPath.length > 3) {
      pushUndo();
      addPendingManualAnnotation({ type: 'brush', points: brushPath.slice(), lineWidth: currentLineWidth });
    }
    brushPath = [];
  } else if (activeTool === 'fill') {
    if (brushPath.length > 3) {
      pushUndo();
      addPendingManualAnnotation({ type: 'fill', points: brushPath.slice(), lineWidth: currentLineWidth });
      document.getElementById('statusHint').textContent = '区域填充已完成，请在下拉列表选择标签';
    }
    brushPath = [];
  }
  saveAnnotations();
  redraw(); updateUI();
  syncLabelDropdown();
});

document.addEventListener('mousemove', function(e) {
  updatePanPosition(e);
});

document.addEventListener('mouseup', function() {
  endPanDrag();
  endLabelDrag();
  endEraserStroke();
});

/* ============ MEASUREMENT ============ */
function addMeasurement(type, value, points) {
  var id = measurementIdCounter++;
  pushUndo();
  var unit = type === 'length' ? 'px' : type === 'angle' ? '°' : 'px²';
  measurementResults.push({ id: id, type: type, value: value, points: points, unit: unit });
  updateMeasurementDisplay();
  saveAnnotations();
}

function buildAIStructureMeasurement(idPrefix, type, name, value, points, structure, confidence, basis, sourceItem, extraSourceItems) {
  var unit = type === 'length' ? 'px' : type === 'angle' ? '\u00b0' : 'px\u00b2';
  var sourceIds = [];
  var sourceId = getStructureAnnotationId(sourceItem);
  if (sourceId !== null) sourceIds.push(sourceId);
  if (extraSourceItems && extraSourceItems.length) {
    for (var i = 0; i < extraSourceItems.length; i++) {
      var extraId = getStructureAnnotationId(extraSourceItems[i]);
      if (extraId !== null && sourceIds.indexOf(extraId) < 0) sourceIds.push(extraId);
    }
  }
  var result = {
    id: measurementIdCounter++,
    type: type,
    name: name,
    value: Math.round(value * 10) / 10,
    points: points,
    unit: unit,
    source: 'ai-structure',
    structure: structure,
    confidence: confidence,
    basis: basis,
    aiId: idPrefix
  };
  if (sourceIds.length) {
    result.sourceAnnotationId = sourceIds[0];
    result.sourceAnnotationIds = sourceIds;
  }
  return result;
}

function getStructureAnnotationId(item) {
  if (!item || item.id === undefined || item.id === null) return null;
  return String(item.id);
}

function measurementBelongsToAnnotation(measurement, annotation) {
  if (!measurement || !annotation) return false;
  var id = getStructureAnnotationId(annotation);
  if (id === null) return false;
  if (measurement.sourceAnnotationIds && measurement.sourceAnnotationIds.length) {
    return measurement.sourceAnnotationIds.map(String).indexOf(id) >= 0;
  }
  return measurement.sourceAnnotationId !== undefined && String(measurement.sourceAnnotationId) === id;
}

function getAnnotationMeasurements(annotation) {
  var results = [];
  for (var i = 0; i < measurementResults.length; i++) {
    if (measurementBelongsToAnnotation(measurementResults[i], annotation)) results.push(measurementResults[i]);
  }
  return results;
}

function remapMeasurementSourceAnnotationIds(idMap) {
  if (!idMap) return;
  for (var i = 0; i < measurementResults.length; i++) {
    var m = measurementResults[i];
    if (!m) continue;
    if (m.sourceAnnotationId !== undefined && idMap[String(m.sourceAnnotationId)]) {
      m.sourceAnnotationId = idMap[String(m.sourceAnnotationId)];
    }
    if (m.sourceAnnotationIds && m.sourceAnnotationIds.length) {
      for (var j = 0; j < m.sourceAnnotationIds.length; j++) {
        var id = String(m.sourceAnnotationIds[j]);
        if (idMap[id]) m.sourceAnnotationIds[j] = idMap[id];
      }
    }
  }
}

function renderAnnotationMeasurementDetails(annotation) {
  var rows = getAnnotationMeasurements(annotation);
  if (!rows.length) return '';
  var html = '<div class="anno-measurements" onclick="event.stopPropagation()">' +
    '<div class="anno-measurement-title">测量信息</div>';
  for (var i = 0; i < rows.length; i++) {
    var m = rows[i];
    html += '<div class="anno-measurement-row">' +
      '<span class="anno-measurement-name">' + escapeLabelText(getMeasurementName(m)) + '</span>' +
      '<span class="anno-measurement-value">' + Number(m.value || 0).toFixed(1) + ' ' + escapeLabelText(m.unit || '') + '</span>' +
      '<button class="anno-measurement-del" title="删除此测量" onclick="event.stopPropagation();deleteMeasurement(' + m.id + ');return false;">×</button>' +
      '</div>';
  }
  html += '</div>';
  return html;
}

function getAIStructureSources() {
  var sources = [];  sources = sources.concat(aiAnnotations || []).concat(manualAnnotations || []);
  return sources.filter(function(item) {
    return item && isMeasurableAnnotationItem(item);
  });
}

function isMeasurableAnnotationItem(item) {
  if (!item) return false;
  if (item.bbox && item.bbox.length >= 4) return true;
  if (item.points && item.points.length >= 2) return true;
  return item.x !== undefined && item.y !== undefined && item.w !== undefined && item.h !== undefined;
}

function isLesionMeasurementLabel(label) {
  return hasText(label, ['微血管瘤', '微动脉瘤', '出血', '渗出', '水肿', '新生血管', 'CNV', '玻璃膜疣', '纤维增生', '病灶']);
}

function isKeyStructureMeasurementItem(item) {
  var label = getStructureLabel(item);
  if (!label || isLesionMeasurementLabel(label)) return false;
  return hasText(label, ['视盘', '黄斑', '血管', '动静脉', '视杯', '杯盘', '盘沿', '视神经']);
}

function hasAIStructureMeasurementSource() {
  return getAIStructureSources().some(function(item) {
    return item && (item.bbox || item.points || (item.x !== undefined && item.y !== undefined));
  });
}

function getAIStructureBox(img, type) {
  var sources = getAIStructureSources();
  for (var i = 0; i < sources.length; i++) {
    var item = sources[i] || {};
    var label = item.type || item.label || '';
    if (label.indexOf(type) < 0) continue;
    if (item.bbox && item.bbox.length >= 4) {
      return {
        x: item.bbox[0] + item.bbox[2] / 2,
        y: item.bbox[1] + item.bbox[3] / 2,
        w: item.bbox[2],
        h: item.bbox[3],
        confidence: item.confidence || 0.86,
        sourceItem: item
      };
    }
    if (item.x !== undefined && item.y !== undefined && item.w !== undefined && item.h !== undefined) {
      return { x: item.x, y: item.y, w: item.w, h: item.h, confidence: item.confidence || 0.86, sourceItem: item };
    }
  }
  return null;
}

function getAIVesselAngleInfo() {
  var sources = getAIStructureSources();
  for (var i = 0; i < sources.length; i++) {
    var item = sources[i] || {};
    var label = item.type || item.label || '';
    if (!hasText(label, ['血管', '动静脉'])) continue;
    if (item.points && item.points.length >= 3) {
      return { points: [item.points[0], item.points[Math.floor(item.points.length / 2)], item.points[item.points.length - 1]], sourceItem: item };
    }
    if (item.bbox && item.bbox.length >= 4) {
      var x = item.bbox[0], y = item.bbox[1], w = item.bbox[2], h = item.bbox[3];
      return { points: [[x, y + h], [x + w / 2, y + h / 2], [x + w, y]], sourceItem: item };
    }
    if (item.x !== undefined && item.y !== undefined && item.w !== undefined && item.h !== undefined) {
      return { points: [[item.x - item.w / 2, item.y + item.h / 2], [item.x, item.y], [item.x + item.w / 2, item.y - item.h / 2]], sourceItem: item };
    }
  }
  return null;
}

function getStructureLabel(item) {
  return item && (item.label || item.type || item.name || '结构');
}

function getStructureConfidence(item) {
  return item && item.confidence ? item.confidence : 0.86;
}

function getStructureBox(item) {
  if (!item) return null;
  if (item.bbox && item.bbox.length >= 4) {
    return {
      x: item.bbox[0] + item.bbox[2] / 2,
      y: item.bbox[1] + item.bbox[3] / 2,
      w: item.bbox[2],
      h: item.bbox[3]
    };
  }
  if (item.x !== undefined && item.y !== undefined && item.w !== undefined && item.h !== undefined) {
    return { x: item.x, y: item.y, w: item.w, h: item.h };
  }
  return null;
}

function pointDistance(p1, p2) {
  return Math.sqrt(Math.pow(p1[0] - p2[0], 2) + Math.pow(p1[1] - p2[1], 2));
}

function polylineLength(points) {
  var len = 0;
  for (var i = 1; i < points.length; i++) len += pointDistance(points[i - 1], points[i]);
  return len;
}

function addBoxStructureMeasurements(results, item, index) {
  var box = getStructureBox(item);
  if (!box || box.w <= 0 || box.h <= 0) return;
  var label = getStructureLabel(item);
  var confidence = getStructureConfidence(item);
  var longHorizontal = box.w >= box.h;
  var longPoints = longHorizontal ?
    [box.x - box.w/2, box.y, box.x + box.w/2, box.y] :
    [box.x, box.y - box.h/2, box.x, box.y + box.h/2];
  var shortPoints = longHorizontal ?
    [box.x, box.y - box.h/2, box.x, box.y + box.h/2] :
    [box.x - box.w/2, box.y, box.x + box.w/2, box.y];
  var areaType = hasText(label, ['视盘', '黄斑', '椭圆']) ? 'ellipse' : 'rect';
  var areaValue = areaType === 'ellipse' ? Math.PI * (box.w/2) * (box.h/2) : box.w * box.h;
  results.push(buildAIStructureMeasurement('ai_box_long_' + index, 'length', label + '长径', Math.max(box.w, box.h), longPoints, label, confidence, '基于前置标注边界自动计算长径', item));
  results.push(buildAIStructureMeasurement('ai_box_short_' + index, 'length', label + '短径', Math.min(box.w, box.h), shortPoints, label, confidence, '基于前置标注边界自动计算短径', item));
  results.push(buildAIStructureMeasurement('ai_box_area_' + index, areaType, label + '面积', areaValue, [box.x - box.w/2, box.y - box.h/2, box.w, box.h], label, confidence, '基于前置标注边界自动计算面积', item));
}

function addPointStructureMeasurements(results, item, index) {
  if (!item || !item.points || item.points.length < 2) return;
  var points = item.points;
  var label = getStructureLabel(item);
  var confidence = getStructureConfidence(item);
  if (points.length === 2) {
    results.push(buildAIStructureMeasurement('ai_line_length_' + index, 'length', label + '长度', pointDistance(points[0], points[1]), [points[0][0], points[0][1], points[1][0], points[1][1]], label, confidence, '基于前置线段标注自动计算长度', item));
    return;
  }
  results.push(buildAIStructureMeasurement('ai_polyline_length_' + index, 'length', label + '走形长度', polylineLength(points), [points[0][0], points[0][1], points[points.length - 1][0], points[points.length - 1][1]], label, confidence, '基于前置折线标注自动计算走形长度', item));
  results.push(buildAIStructureMeasurement('ai_points_area_' + index, 'area', label + '面积', calcPolygonArea(points), points.slice(), label, confidence, '基于前置多边形标注自动计算面积', item));
  results.push(buildAIStructureMeasurement('ai_points_angle_' + index, 'angle', label + '角度', calcAngle(points[0], points[Math.floor(points.length / 2)], points[points.length - 1]), [points[0], points[Math.floor(points.length / 2)], points[points.length - 1]], label, confidence, '基于前置三点结构自动计算角度', item));
}

function createAIStructureMeasurements(img) {
  var results = [];
  var sources = getAIStructureSources();
  for (var i = 0; i < sources.length; i++) {
    addBoxStructureMeasurements(results, sources[i], i);
    addPointStructureMeasurements(results, sources[i], i);
  }
  var disc = getAIStructureBox(img, '视盘');
  var macula = getAIStructureBox(img, '黄斑');
  var vesselInfo = getAIVesselAngleInfo();
  if (disc && macula) {
    results.push(buildAIStructureMeasurement('ai_disc_macula_distance', 'length', '视盘-黄斑中心距', Math.sqrt(Math.pow(disc.x-macula.x,2)+Math.pow(disc.y-macula.y,2)), [disc.x, disc.y, macula.x, macula.y], '视盘/黄斑', Math.min(disc.confidence, macula.confidence), '基于前置视盘与黄斑中心点计算距离', disc.sourceItem, [macula.sourceItem]));
  }
  if (vesselInfo && vesselInfo.points) {
    results.push(buildAIStructureMeasurement('ai_vessel_arc_angle', 'angle', '血管弓夹角', calcAngle(vesselInfo.points[0], vesselInfo.points[1], vesselInfo.points[2]), vesselInfo.points, '血管弓', 0.83, '基于前置血管/动静脉标注走形计算夹角', vesselInfo.sourceItem));
  }
  return results;
}

function runAIStructureMeasurement() {
  if (currentImageIndex < 0 || !uploadedImages[currentImageIndex]) { alert('请先选择影像'); return; }
  if (!hasAIStructureMeasurementSource()) {
    alert('请先完成自动标注或人工标注后，再进行AI结构测量');
    document.getElementById('statusHint').textContent = 'AI结构测量需要前置标注结果';
    return;
  }
  if (!canUseAIForCurrentImage('AI结构测量')) return;
  document.getElementById('statusHint').textContent = '📏 AI结构测量中...';
  setTimeout(function() {
    var img = uploadedImages[currentImageIndex];
    pushUndo();
    measurementResults = measurementResults.filter(function(m) { return !m || m.source !== 'ai-structure'; });
    var aiMeasurements = createAIStructureMeasurements(img);
    if (!aiMeasurements.length) {
      updateUI();
      saveAnnotations();
      redraw();
      updateAIStructureClearButton();
      alert('当前前置标注中未找到可测量的几何标注');
      document.getElementById('statusHint').textContent = 'AI结构测量未生成结果：缺少可测量标注';
      return;
    }
    measurementResults = measurementResults.concat(aiMeasurements);
    updateUI();
    saveAnnotations();
    redraw();
    updateAIStructureClearButton();
    document.getElementById('statusHint').textContent = '✅ AI结构测量完成，生成 ' + aiMeasurements.length + ' 项参数';
  }, 500);
}

function calcAngle(p1, p2, p3) {
  var a = Math.pow(p2[0]-p1[0],2)+Math.pow(p2[1]-p1[1],2);
  var b = Math.pow(p2[0]-p3[0],2)+Math.pow(p2[1]-p3[1],2);
  var c = Math.pow(p3[0]-p1[0],2)+Math.pow(p3[1]-p1[1],2);
  var cos = (a+b-c)/(2*Math.sqrt(a)*Math.sqrt(b));
  return Math.round(Math.acos(Math.max(-1,Math.min(1,cos)))*180/Math.PI*10)/10;
}

function calcPolygonArea(pts) {
  var area = 0;
  for (var i = 0, j = pts.length-1; i < pts.length; j = i++) {
    area += (pts[j][0]+pts[i][0])*(pts[j][1]-pts[i][1]);
  }
  return Math.round(Math.abs(area/2)*10)/10;
}

function updateMeasurementDisplay() {
  var container = document.getElementById('measurementResults');
  var html = '';
  for (var i = 0; i < measurementResults.length; i++) {
    var m = measurementResults[i];
    var cls = m.source === 'ai-structure' ? ' ai-structure' : '';
    var meta = m.source === 'ai-structure' ? '<span class="mr-meta">AI结构测量 · ' + escapeLabelText(m.structure || '-') + ' · ' + Math.round((m.confidence || 0) * 100) + '%</span>' : '';
    html += '<div class="measure-result' + cls + '"><span class="mr-main"><span class="mr-name">' + escapeLabelText(getMeasurementName(m)) + '</span>' + meta + '</span><span class="mr-side"><span class="mr-val">' + m.value.toFixed(1) + ' ' + m.unit + '</span><button class="mr-del" title="删除此测量" onclick="event.stopPropagation();deleteMeasurement(' + m.id + ');return false;">×</button></span></div>';
  }
  container.innerHTML = html;
  updateAIStructureClearButton();
}

function updateAIStructureClearButton() {
  var button = document.getElementById('btnClearAIStructureMeasure');
  if (!button) return;
  var hasAIStructureMeasurement = measurementResults.some(function(m) {
    return m && m.source === 'ai-structure';
  });
  button.textContent = hasAIStructureMeasurement ? '清除AI结构测量' : '清除';
  button.title = hasAIStructureMeasurement ? '清除AI结构测量结果' : '清除全部测量结果';
}

function clearMeasurementResults() {
  var hasAIStructureMeasurement = measurementResults.some(function(m) {
    return m && m.source === 'ai-structure';
  });

    clearAIStructureMeasurements();
