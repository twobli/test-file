<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>输出筛查报告</title>
<style>
:root {
  --primary: #165dff;
  --primary-2: #0f9a83;
  --primary-soft: #e8f3ff;
  --success: #00b42a;
  --warning: #f59a23;
  --danger: #f53f3f;
  --bg: #eef3fb;
  --panel: #ffffff;
  --panel-soft: #f7fbff;
  --line: #e4ebf5;
  --line-strong: #d5deeb;
  --text: #1d2533;
  --muted: #5d6b82;
  --soft: #7c8ba1;
  --shadow: 0 14px 40px rgba(41, 76, 131, 0.12);
  --radius: 12px;
  --radius-lg: 18px;
  --font: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
body { font-size: 14px; line-height: 1.6; }
button { font: inherit; border: 0; cursor: pointer; }

.header {
  height: 58px; display: flex; align-items: center; padding: 0 24px;
  background: linear-gradient(135deg, #1a56db 0%, #2563eb 50%, #1d4ed8 100%);
  color: #fff; position: sticky; top: 0; z-index: 1000;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
.header .logo { color: #fff; text-decoration: none; font-size: 17px; font-weight: 800; letter-spacing: 1px; }
.header .header-nav { display: flex; gap: 4px; margin-left: 32px; }
.header .header-nav a { color: rgba(255,255,255,0.85); text-decoration: none; padding: 6px 14px; border-radius: 8px; font-size: 13px; transition: .18s; }
.header .header-nav a:hover, .header .header-nav a.active { background: rgba(255,255,255,0.15); color: #fff; }
.header .header-right { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 13px; }
.header .btn-logout { background: rgba(255,255,255,0.2); color: #fff; padding: 6px 16px; border-radius: 6px; font-size: 12px; transition: .18s; font-weight: 600; }
.header .btn-logout:hover { background: rgba(255,255,255,0.35); }

.sidebar {
  position: fixed; top: 58px; left: 0; width: 220px;
  height: calc(100vh - 58px); background: #fff; border-right: 1px solid var(--line);
  overflow-y: auto; z-index: 999; padding: 8px 0;
}
.sidebar .menu-group { margin-bottom: 4px; }
.sidebar .menu-group-title { padding: 12px 20px 6px; font-size: 11px; color: var(--soft); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
.sidebar .menu-item { display: flex; align-items: center; padding: 9px 20px; color: var(--muted); text-decoration: none; font-size: 13px; transition: .18s; border-left: 3px solid transparent; }
.sidebar .menu-item:hover { background: var(--panel-soft); color: var(--primary); }
.sidebar .menu-item.active { background: var(--primary-soft); color: var(--primary); border-left-color: var(--primary); font-weight: 600; }

.main-content { margin-left: 220px; padding: 24px; min-height: calc(100vh - 58px); }
.breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.breadcrumb a { color: var(--primary); text-decoration: none; }
.page-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
.page-title { font-size: 24px; font-weight: 900; color: var(--text); }
.page-subtitle { margin-top: 4px; color: var(--muted); font-size: 13px; }

.btn {
  min-height: 36px; padding: 0 14px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font-weight: 700; transition: .16s ease; text-decoration: none;
}
.btn:hover { filter: brightness(1.03); }
.btn.primary { color: #fff; background: linear-gradient(90deg, var(--primary), var(--primary-2)); box-shadow: 0 10px 20px rgba(22, 93, 255, .18); }
.btn.secondary { color: var(--muted); background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.btn.small { min-height: 30px; padding: 0 10px; font-size: 12px; border-radius: 8px; }
.btn.lg { min-height: 44px; padding: 0 22px; font-size: 15px; }

.tag {
  min-height: 22px; padding: 0 8px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700;
  white-space: nowrap;
}
.tag.blue { color: var(--primary); background: var(--primary-soft); }
.tag.success { color: var(--success); background: #e8ffea; }
.tag.warning { color: var(--warning); background: #fff4df; }
.tag.danger { color: var(--danger); background: #ffecec; }
.tag.gray { color: var(--soft); background: #f0f3f8; }

.card { background: #fff; border-radius: var(--radius-lg); box-shadow: 0 10px 24px rgba(61, 102, 150, .08); padding: 20px; margin-bottom: 16px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.section-title { font-size: 17px; font-weight: 900; color: var(--text); }
.section-note { color: var(--soft); font-size: 12px; }

.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.info-panel { border-radius: 14px; background: var(--panel-soft); box-shadow: inset 0 0 0 1px #e8eef8; padding: 16px; }
.info-panel h3 { font-size: 14px; margin-bottom: 10px; color: var(--text); }
.task-panel {
  grid-column: 1 / -1; padding: 16px 18px; border-radius: 16px; background: var(--panel-soft);
  box-shadow: inset 0 0 0 1px #dbe8fb;
}
.task-panel-head {
  display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  margin-bottom: 14px;
}
.task-panel-title { font-size: 16px; font-weight: 900; color: var(--text); }
.task-meta-line { margin-top: 4px; color: var(--soft); font-size: 13px; }
.task-summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.task-summary-item { padding: 14px 16px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1px #edf2f9; }
.task-summary-item span { display: block; color: var(--soft); font-size: 12px; }
.task-summary-item strong { display: block; margin-top: 5px; color: var(--text); font-size: 14px; word-break: break-all; }
.kv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kv { min-width: 0; padding: 10px 12px; border-radius: 10px; background: #fff; box-shadow: inset 0 0 0 1px #edf2f9; }
.kv span { display: block; color: var(--soft); font-size: 12px; }
.kv strong { display: block; margin-top: 3px; color: var(--text); font-size: 13px; word-break: break-all; }
.kv.wide { grid-column: 1 / -1; }

.metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.metric { padding: 14px 16px; border-radius: 12px; background: var(--panel-soft); box-shadow: inset 0 0 0 1px #e8eef8; }
.metric span { display: block; color: var(--soft); font-size: 12px; }
.metric strong { display: block; margin-top: 6px; font-size: 20px; line-height: 1.2; color: var(--text); }

.table-wrap { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: #fff; margin-top: 10px; }
.data-table { width: 100%; border-collapse: collapse; }
.data-table thead th {
  padding: 11px 12px; background: var(--panel-soft); color: var(--soft); font-size: 12px; text-align: left;
  border-bottom: 1px solid var(--line); font-weight: 700;
}
.data-table tbody td { padding: 11px 12px; border-bottom: 1px solid #f0f4f9; vertical-align: middle; }
.data-table tbody tr:last-child td { border-bottom: 0; }
.data-table tbody tr:hover { background: #f9fcff; }

.summary-box { padding: 14px 16px; border-radius: 12px; background: var(--panel-soft); box-shadow: inset 0 0 0 1px #e8eef8; margin-top: 12px; color: var(--muted); }
.summary-box strong { color: var(--text); }
.summary-box p { margin: 6px 0; }

.qc-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.subsection-title { margin: 16px 0 10px; font-size: 14px; font-weight: 900; color: var(--text); }
.qc-eye-summary {
  padding: 14px 16px; border-radius: 12px; background: #fff;
  box-shadow: inset 0 0 0 1px #edf2f9; margin-bottom: 12px;
}
.qc-eye-summary span { display: block; color: var(--soft); font-size: 12px; }
.qc-eye-summary strong { display: block; margin-top: 6px; color: var(--text); font-size: 14px; word-break: break-all; }
.image-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.image-card { border-radius: 12px; overflow: hidden; background: #fff; cursor: pointer; box-shadow: inset 0 0 0 1px #edf2f9; transition: .16s ease; }
.image-card:hover { transform: translateY(-1px); box-shadow: 0 8px 18px rgba(22,93,255,.12), inset 0 0 0 1px #a8c8ff; }
.image-thumb { aspect-ratio: 16 / 9; background: #0b1020; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.image-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.image-meta { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; }
.image-meta strong { display: block; color: var(--text); font-size: 13px; word-break: break-all; }
.image-meta span { display: block; color: var(--soft); font-size: 12px; }
.image-preview-overlay {
  position: fixed; inset: 0; z-index: 20000; background: rgba(0,0,0,.86);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: .2s ease; padding: 24px;
}
.image-preview-overlay.show { opacity: 1; visibility: visible; }
.image-preview-overlay img { max-width: 92vw; max-height: 84vh; object-fit: contain; border-radius: 8px; background: #111827; }
.preview-filename { color: #fff; font-size: 14px; margin-top: 14px; text-align: center; }
.preview-close {
  position: absolute; top: 22px; right: 22px; width: 42px; height: 42px; border-radius: 50%;
  background: rgba(255,255,255,.16); color: #fff; font-size: 24px;
}
.preview-close:hover { background: rgba(255,255,255,.28); }
.report-block { border-radius: 14px; background: var(--panel-soft); box-shadow: inset 0 0 0 1px #e8eef8; padding: 14px; margin-top: 12px; }
.report-block:first-child { margin-top: 0; }
.report-block-title { margin-bottom: 10px; font-size: 14px; font-weight: 900; color: var(--text); }
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
.card-title { font-size: 16px; font-weight: 900; color: var(--text); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.stat { padding: 14px 16px; border-radius: 12px; background: var(--panel-soft); box-shadow: inset 0 0 0 1px #e8eef8; }
.stat span { display: block; color: var(--soft); font-size: 12px; }
.stat strong { display: block; margin-top: 6px; font-size: 20px; line-height: 1.2; color: var(--text); }
.alert { padding: 12px 14px; border-radius: 12px; margin-bottom: 14px; line-height: 1.75; }
.alert-info { background: #eef6ff; color: #155d91; border: 1px solid #bfdbfe; }
.alert-warning { background: #fff8e8; color: #92400e; border: 1px solid #fde68a; }
.qc-progress-shell { padding: 14px; border-radius: 14px; background: #f8fbff; box-shadow: inset 0 0 0 1px #e8eef8; margin-bottom: 14px; }
.qc-progress-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.qc-progress-label { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 800; }
.qc-progress-icon { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; background: var(--success); font-size: 13px; }
.qc-progress-pct { color: var(--primary); font-weight: 900; }
.qc-progress-track { height: 8px; border-radius: 999px; background: #e5edf7; overflow: hidden; }
.qc-progress-fill { width: 100%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--primary-2)); }
.native-report { border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; margin-bottom: 16px; }
.native-page { padding: 24px 30px 20px; background: #fff; }
.native-page + .native-page { border-top: 12px solid #f1f5fb; }
.native-title { margin: 0 0 18px; color: #7b168e; font-size: 21px; font-weight: 900; }
.native-subtitle { margin: 18px 0 10px; color: #1f2937; font-size: 14px; font-weight: 900; }
.visual-matrix { display: grid; grid-template-columns: 58px repeat(4, minmax(120px, 1fr)); gap: 18px 20px; align-items: center; padding: 6px 0 22px; border-bottom: 1px solid #e5e7eb; }
.visual-matrix.lesion { padding-top: 24px; border-bottom: 0; }
.visual-head { justify-self: center; min-width: 76px; padding: 4px 10px; border-radius: 3px; background: #7b168e; color: #fff; text-align: center; font-size: 12px; font-weight: 900; }
.eye-label { color: #374151; font-size: 13px; font-weight: 900; }
.fundus-cell { min-height: 126px; display: flex; align-items: center; justify-content: center; }
.fundus-art { position: relative; width: 116px; aspect-ratio: 1; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 76% 45%, rgba(255,244,176,.95) 0 5%, transparent 7%), radial-gradient(circle at 52% 54%, rgba(82,23,12,.18) 0 8%, transparent 14%), radial-gradient(circle at 45% 48%, #d17634 0, #ad4d24 38%, #6e2b1c 70%, #2d1011 100%); box-shadow: inset 0 0 14px rgba(80,20,6,.45), 0 8px 18px rgba(123,22,142,.12); }
.fundus-art.right { transform: scaleX(-1); }
.fundus-art::before, .fundus-art::after { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }
.fundus-art::before { background: radial-gradient(circle at 77% 46%, rgba(255,255,255,.8) 0 2%, transparent 4%), conic-gradient(from 40deg at 78% 45%, transparent 0 18deg, rgba(120,23,16,.5) 20deg 24deg, transparent 28deg 68deg, rgba(120,23,16,.45) 72deg 76deg, transparent 80deg 144deg, rgba(120,23,16,.45) 148deg 153deg, transparent 160deg 360deg); opacity: .82; }
.fundus-art.vessel::after { background: linear-gradient(22deg, transparent 44%, #d72b39 45%, transparent 47%), linear-gradient(152deg, transparent 44%, #d62839 45%, transparent 47%), linear-gradient(86deg, transparent 48%, #165dff 49%, transparent 51%), linear-gradient(118deg, transparent 52%, #1d4ed8 53%, transparent 55%); mix-blend-mode: multiply; opacity: .85; }
.marker-disc, .marker-macula, .marker-lesion { position: absolute; border-radius: 50%; z-index: 2; pointer-events: none; }
.marker-disc { right: 14px; top: 42px; width: 22px; height: 22px; border: 2px solid #9b2cc0; box-shadow: 0 0 0 2px rgba(155,44,192,.16); }
.marker-macula { left: 45px; top: 55px; width: 17px; height: 17px; border: 2px solid #ef4444; background: rgba(239,68,68,.1); }
.marker-lesion { left: 30px; top: 38px; width: 22px; height: 18px; border: 2px solid #22c55e; background: rgba(34,197,94,.08); }
.marker-lesion.alt { left: auto; top: auto; right: 24px; bottom: 24px; width: 30px; height: 24px; border-color: #06b6d4; background: rgba(6,182,212,.1); }
.native-table-wrap { overflow-x: auto; margin-top: 10px; }
.native-table-note { display: flex; justify-content: space-between; gap: 12px; color: var(--soft); font-size: 12px; margin-bottom: 8px; }
.native-table { width: 100%; min-width: 760px; border-collapse: collapse; table-layout: fixed; font-size: 12px; }
.native-table.wide { min-width: 1080px; }
.native-table.compact { min-width: 620px; }
.native-table th { padding: 9px 8px; background: #7b168e; color: #fff; border: 1px solid #fff; text-align: center; font-weight: 900; }
.native-table td { padding: 9px 8px; border: 1px solid #fff; background: #f6f6f7; color: #374151; text-align: center; }
.native-table tr:nth-child(even) td { background: #fff; }
.native-table .name { color: #7b168e; font-weight: 900; }
.quant-group { display: grid; gap: 12px; }
.quant-group + .quant-group { margin-top: 14px; }
.lesion-eye-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.lesion-eye-label { margin-bottom: 10px; color: #374151; font-size: 14px; font-weight: 900; }
.lesion-result-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
.lesion-result-table th { padding: 11px 14px; background: #7b168e; color: #fff; border: 1px solid #fff; text-align: left; font-weight: 900; }
.lesion-result-table th:last-child, .lesion-result-table td:last-child { text-align: right; }
.lesion-result-table td { padding: 10px 14px; border: 1px solid #fff; background: #f6f6f7; color: #374151; }
.lesion-result-table tr:nth-child(even) td { background: #fff; }
.lesion-normal { color: #26b81f; font-weight: 900; white-space: nowrap; }
.result-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.result-card { padding: 14px; border-radius: 12px; background: #f8fbff; box-shadow: inset 0 0 0 1px #e8eef8; }
.result-card .result-name { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.result-card .result-status { display: inline-block; margin-bottom: 6px; }
.result-card .result-desc { color: var(--muted); font-size: 12px; line-height: 1.5; }
.download-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; background: linear-gradient(135deg, #f8fbff, #eef7ff); }
.download-card p { color: var(--muted); margin-top: 4px; }

@media (max-width: 1024px) {
  .sidebar { width: 60px; }
  .sidebar .menu-item { padding: 10px 12px; font-size: 0; }
  .sidebar .menu-group-title { display: none; }
  .main-content { margin-left: 60px; }
  .info-grid, .task-summary-grid, .metric-grid, .qc-list, .image-grid, .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .visual-matrix { grid-template-columns: 50px repeat(2, minmax(118px, 1fr)); }
  .visual-spacer { display: none; }
  .lesion-eye-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .header { height: auto; flex-wrap: wrap; padding: 12px 16px; gap: 8px; }
  .header .header-nav { margin-left: 0; flex-wrap: wrap; }
  .sidebar { display: none; }
  .main-content { margin-left: 0; padding: 14px; }
  .page-title-row, .download-card { flex-direction: column; align-items: stretch; }
  .info-grid, .task-summary-grid, .kv-grid, .metric-grid, .qc-list, .image-grid, .stats, .result-grid { grid-template-columns: 1fr; }
  .image-thumb { height: 150px; }
  .native-page { padding: 18px 12px 14px; }
}
</style>
</head>

function getFlowRoleFromUrl() {
  var role = new URLSearchParams(window.location.search).get('role');

function getFlowRole() {
  var role = getFlowRoleFromUrl();
  if (role) return role;

  if (task && task.userType) return task.userType;
  var user = readCurrentUser();
  var text = ((user.role || '') + ' ' + (user.name || '')).toLowerCase();
  if (/普通|患者|居民|公众/.test(text)) return 'normal';
  return 'doctor';
}
function escapeHtml(str) {
  return String(str || '').replace(/[&<>"']/g, function(ch) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
  });
}
function tag(text, type) {
  return '<span class="tag ' + type + '">' + escapeHtml(text) + '</span>';
}
function reportId(task) {
  return task && task.taskId ? task.taskId.replace('FS-', 'RP-') : 'RP-260626-001';

function reportTime(task) {

  if (!name) return '—';

}
function patientInfo(task) {
  return task && task.patient ? task.patient : { name: '李子明', age: '23', gender: '男' };

function slotLabel(slot) {

  if (slot === 'right' || slot === 'second') return '右眼位';

}
function eyeLabel(task, img, index) {
  if (img && img.qcEye) return img.qcEye;
  if (img && img.detectedEye && img.detectedEye !== '未识别') return img.detectedEye;
  if (img && img.eye) return img.eye;
  if (task && task.uploadMode === 'double') return index === 0 ? '左眼' : '右眼';
  return '右眼';
}
function imageSummary(task) {
  var imgs = task && task.images ? task.images : [];

}

    '<g stroke="#7b2c0b" stroke-width="5" fill="none" opacity=".7">' +

function historyHtml(role, task) {
  var currentType = role === 'doctor' ? '多任务联合筛查报告' : '常见疾病筛查报告';
  var patient = patientInfo(task);
  var historyPatientName = displayPatientName(patient.name);
  var rows = [
    [reportId(task), historyPatientName, currentType, reportTime(task)],
    [role === 'doctor' ? 'RP-260626-018' : 'RP-260626-009', role === 'doctor' ? '陈华' : historyPatientName, currentType, '2026-06-26 16:05'],
    [role === 'doctor' ? 'RP-260625-021' : 'RP-260625-014', role === 'doctor' ? '赵强' : historyPatientName, currentType, '2026-06-25 11:20']
  ];
  return rows.map(function(row) {
    return '<tr><td><strong>' + escapeHtml(row[0]) + '</strong></td><td>' + escapeHtml(row[1]) + '</td><td>' + escapeHtml(row[2]) + '</td><td>' + escapeHtml(row[3]) + '</td><td><button class="btn secondary small" onclick="alert(&quot;报告已下载。&quot;)">下载</button></td></tr>';
  }).join('');
}
function activateFlowSidebar() {
  var role = getFlowRole();
  document.querySelectorAll('.sidebar .menu-item').forEach(function(item) {
    item.classList.toggle('active', item.getAttribute('data-flow-page') === '输出筛查报告.html' && item.getAttribute('data-flow-role') === role);
  });
}
function downloadReport() {
  var role = getFlowRole();
  var label = role === 'doctor' ? '多任务联合筛查报告' : '常见疾病筛查报告';
  alert(label + '下载功能已触发，文件将保存至本地。');
}
function renderReport() {
  var task = readFundusTask();
  var role = getFlowRole();
  var isDoctor = role === 'doctor';
  var sourceText = '结果来源：筛查+质控';
  var reportText = isDoctor ? '多任务联合筛查报告' : '常见疾病筛查报告';

  document.getElementById('roleBadge').textContent = isDoctor ? '多任务联合筛查' : '常见疾病筛查';
  document.getElementById('roleBadge').className = 'tag ' + (isDoctor ? 'blue' : 'success');
  document.getElementById('reportSubtitle').textContent = isDoctor
    ? '报告根据多任务联合筛查结果生成。'
    : '报告根据常见疾病筛查结果生成。';
  document.getElementById('sourceNote').textContent = sourceText;
  document.getElementById('baseInfoGrid').innerHTML = baseInfoHtml(role, task);
  document.getElementById('screeningTitle').textContent = isDoctor ? '筛查信息：多任务联合筛查' : '筛查信息：常见疾病筛查';
  document.getElementById('screeningNote').textContent = sourceText;
  document.getElementById('screeningContent').innerHTML = isDoctor ? doctorScreeningHtml(task) : normalScreeningHtml(task);
  document.getElementById('qcContent').innerHTML = qcInfoHtml(task);
  document.getElementById('downloadHint').textContent = '下载' + reportText + '。';
  document.getElementById('downloadReportBtn').textContent = '下载' + reportText;
  document.getElementById('historyNote').textContent = isDoctor ? '仅展示多任务联合筛查报告' : '仅展示常见疾病筛查报告';
  document.getElementById('historyRows').innerHTML = historyHtml(role, task);
}
document.addEventListener('DOMContentLoaded', function() {
  var user = readCurrentUser();
  if (user && user.name) document.getElementById('headerUserName').textContent = user.name;
  activateFlowSidebar();
  renderReport();
  var overlay = document.getElementById('reportImageOverlay');
  if (overlay) {
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closeReportImage();
    });
  }
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeReportImage();
  });
});
</script>
