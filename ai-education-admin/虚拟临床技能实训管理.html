<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虚拟临床技能实训管理</title>
  <link rel="stylesheet" href="技能实践管理.css">
  <style>
    .upload-slot-list { display: grid; gap: 10px; grid-column: 1 / -1; }
    .upload-slot { display: grid; gap: 6px; padding: 12px; border: 1px dashed #b8c7d9; border-radius: 8px; background: #fff; }
    .upload-slot strong { color: #435066; font-size: 13px; }
    .assign-user-select { width: 100%; min-height: 148px; padding: 8px 10px; line-height: 1.7; }
    .assign-user-select option { padding: 5px 8px; }
    .assign-user-note { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <a class="brand" href="../app-center.html"><div class="brand-mark">AI</div><div class="brand-title"><strong>生命医学管理后台</strong><span>独立运营管理系统</span></div></a>
      <div class="nav-group-title">业务工作台</div>
      <a class="nav-item" href="index.html#courses"><span class="nav-icon">▤</span>教师课程管理端</a>
      <a class="nav-item" href="index.html#cases"><span class="nav-icon">◫</span>案例教学管理</a>
      <a class="nav-item" href="技能实践管理.html"><span class="nav-icon">◉</span>技能实践管理</a>
      <a class="nav-item active child" href="虚拟临床技能实训管理.html"><span class="nav-icon">01</span>虚拟临床技能实训</a>
      <a class="nav-item child" href="经典病例诊断实训管理.html"><span class="nav-icon">02</span>经典病例诊断实训</a>
      <a class="nav-item child" href="读片与病例大赛系统管理.html"><span class="nav-icon">03</span>读片与病例大赛系统</a>
      <a class="nav-item" href="index.html#exams"><span class="nav-icon">✎</span>考试中心管理</a>
      <a class="nav-item" href="index.html#knowledge"><span class="nav-icon">教</span>智能教学服务管理后台</a>
      <a class="nav-item" href="index.html#literature"><span class="nav-icon">文</span>科技文献检索管理</a>
      <a class="nav-item" href="方案题目管理.html"><span class="nav-icon">✎</span>方案题目管理</a>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow">Skill Practice / Module 01</p><h1>虚拟临床技能实训管理</h1></div>
      </header>
      <div class="breadcrumb"><a href="技能实践管理.html">技能实践管理</a><span class="sep">&gt;</span><span>虚拟临床技能实训</span></div>
      <div class="toolbar">
        <div class="filters"><input class="input" id="search" placeholder="搜索病例号或患者姓名" oninput="render()"></div><button class="btn primary" style="margin-left:auto;" onclick="openModal()">＋ 新建虚拟病例</button></div>
      <section class="panel">
        <div class="panel-head"><div><h2 class="panel-title">虚拟病例列表</h2><p class="panel-subtitle">录入与前台“虚拟病人信息”和“患者影像资料”对应的病例内容。</p></div></div>
        <div class="table-wrap"><table><thead><tr><th>病例号</th><th>患者信息</th><th>主诉</th><th>影像资料</th><th>操作</th></tr></thead><tbody id="tableBody"></tbody></table></div>
      </section>
    </main>
  </div>
  <div class="modal-mask" id="mask" onclick="closeModal()"></div>
  <section class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h2 id="modalTitle">新建虚拟病例</h2><p id="modalDesc">录入学生端会展示的病例信息和患者影像资料。</p></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="saveBtn" onclick="save()">保存</button></div>
  </section>
  <div class="modal-mask" id="audienceMask" onclick="closeAudienceModal()"></div>
  <section class="modal" id="audienceModal" role="dialog" aria-modal="true">
    <div class="modal-head"><h2 id="audienceTitle">分配用户</h2><p id="audienceDesc">只分配当前虚拟病例的可见用户。</p></div>
    <div class="modal-body" id="audienceBody"></div>
    <div class="modal-foot"><button class="btn" onclick="closeAudienceModal()">取消</button><button class="btn primary" onclick="saveAudience()">保存</button></div>
  </section>
  <div class="toast" id="toast"></div>
  <script>
    var rows = [
      {
        code:'VC-2026-001',
        patient:{name:'小王', gender:'女', age:'58', history:'2型糖尿病12年，高血压6年，高脂血症5年，口服二甲双胍+格列美脲降糖。', chiefComplaint:'双眼视力模糊3个月，加重伴左眼视物变形1周。无明显眼痛、眼红、畏光。'},
        summary:'女性，58岁，糖尿病及高血压病史多年，近期双眼视物模糊并伴左眼视物变形。',
        vitals:[['血压','145/92 mmHg'],['空腹血糖','8.7 mmol/L'],['HbA1c','8.2%'],['BMI','26.8 kg/m²'],['视力（右）','0.5'],['视力（左）','0.3'],['眼压（右）','16 mmHg'],['眼压（左）','17 mmHg']],
        imaging:{type:'眼底彩照',eyeMode:'双眼',singleEye:'右眼',files:{right:'',left:''}},
        audience:['张医生','李医生','刘医生']
      },
      {
        code:'VC-2026-002',
        patient:{name:'小张', gender:'男', age:'32', history:'1型糖尿病8年，胰岛素泵治疗。否认高血压、高脂血症。', chiefComplaint:'年度眼科常规筛查，无明显视力下降。近半年偶有视物模糊，休息后可缓解。'},
        summary:'男性，32岁，1型糖尿病病史8年，因年度眼科筛查进入实训病例。',
        vitals:[['血压','118/76 mmHg'],['空腹血糖','6.5 mmol/L'],['HbA1c','7.1%'],['BMI','22.4 kg/m²'],['视力（右）','1.0'],['视力（左）','0.9'],['眼压（右）','14 mmHg'],['眼压（左）','15 mmHg']],
        imaging:{type:'OCT',eyeMode:'双眼',singleEye:'右眼',files:{right:'',left:''}},
        audience:['王医生','赵医生']
      },
      {
        code:'VC-2026-003',
        patient:{name:'老李', gender:'男', age:'65', history:'2型糖尿病20年，高血压15年，冠心病5年，口服胰岛素、二甲双胍和达格列净。', chiefComplaint:'右眼视物模糊伴飞蚊感2个月，近2周加重，偶有闪光感。'},
        summary:'男性，65岁，糖尿病及高血压病史较长，右眼视物模糊伴飞蚊感加重。',
        vitals:[['血压','152/88 mmHg'],['空腹血糖','10.2 mmol/L'],['HbA1c','9.5%'],['BMI','28.1 kg/m²'],['视力（右）','0.2'],['视力（左）','0.4'],['眼压（右）','18 mmHg'],['眼压（左）','15 mmHg']],
        imaging:{type:'OCTA',eyeMode:'单眼',singleEye:'右眼',files:{right:'',left:''}},
        audience:['陈医生','周医生','韩医生']
      },
      {
        code:'VC-2026-004',
        patient:{name:'老赵', gender:'男', age:'61', history:'2型糖尿病18年，血糖控制极差，高血压10年，糖尿病肾病IV期透析中。', chiefComplaint:'左眼突然视力急剧下降3天，仅存光感；右眼视物模糊伴视野缺损半年。'},
        summary:'男性，61岁，长期糖尿病合并肾病透析，左眼突发视力明显下降。',
        vitals:[['血压','168/95 mmHg'],['空腹血糖','13.5 mmol/L'],['HbA1c','11.2%'],['BMI','24.5 kg/m²'],['视力（右）','0.1'],['视力（左）','光感'],['眼压（右）','22 mmHg'],['眼压（左）','25 mmHg']],
        imaging:{type:'眼底彩照',eyeMode:'双眼',singleEye:'右眼',files:{right:'',left:''}},
        audience:['孙医生','刘医生']
      }
    ];
    var audienceEditingCode = '';
    var audienceStaff = [
      {name:'张医生',role:'眼底病方向'},
      {name:'李医生',role:'住院医师'},
      {name:'王医生',role:'青光眼方向'},
      {name:'赵医生',role:'眼底病方向'},
      {name:'陈医生',role:'黄斑病方向'},
      {name:'周医生',role:'科研组'},
      {name:'孙医生',role:'规培医师'},
      {name:'刘医生',role:'高级研修班'},
      {name:'韩医生',role:'科研课题组'}
    ];
    var editing = null;
    function esc(v){return String(v == null ? '' : v).replace(/[&<>"']/g,function(s){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];});}
    function render(){
      var q=(document.getElementById('search').value||'').toLowerCase();
      var list=rows.filter(function(r){return (!q||(r.code+r.patient.name).toLowerCase().indexOf(q)>-1);});
      document.getElementById('tableBody').innerHTML=list.length?list.map(function(r){
        return '<tr><td class="mono">'+esc(r.code)+'</td>'
          +'<td>'+esc(r.patient.name)+' / '+esc(r.patient.gender)+' / '+esc(r.patient.age)+'岁</td>'
          +'<td>'+esc(r.patient.chiefComplaint).slice(0,32)+(r.patient.chiefComplaint.length>32?'…':'')+'</td>'
          +'<td>'+imageSummary(r)+'</td>'
          +'<td><button class="btn small" onclick="openAudienceModal(\''+r.code+'\')">分配用户</button></td></tr>';
      }).join(''):'<tr><td colspan="5"><div class="empty-note">没有匹配的虚拟病例。</div></td></tr>';
    }
    function imageSummary(r){
      var im=r.imaging||{}, type=im.type||'眼底彩照', side=im.eyeMode==='单眼'?(im.singleEye||'右眼')+' 1份':'右眼、左眼 2份';
      return esc(type)+'<div class="muted">'+esc(side)+'</div>';
    }
    function inputField(id,label,value,dis,cls){
      var fieldClass=cls==='span-2'?' span-2':'';
      var inputClass=cls==='mono'?' mono':'';
      return '<div class="form-field'+fieldClass+'"><label>'+label+'</label><input class="input'+inputClass+'" id="'+id+'" value="'+esc(value)+'"'+(dis?' disabled':'')+'></div>';
    }
    function optionSelected(current,value){return current===value?' selected':'';}
    function textField(id,label,value,dis,full){
      return '<div class="form-field '+(full?'span-4':'')+'"><label>'+label+'</label><textarea id="'+id+'"'+(dis?' disabled':'')+'>'+esc(value)+'</textarea></div>';
    }
    function assignedUserSelect(selected,id){
      selected=Array.isArray(selected)?selected:[];
      return '<select class="select assign-user-select" id="'+id+'" multiple size="6">'+audienceStaff.map(function(person){
        var selectedText=selected.indexOf(person.name)>-1?' selected':'';
        return '<option value="'+esc(person.name)+'"'+selectedText+'>'+esc(person.name+'（'+person.role+'）')+'</option>';
      }).join('')+'</select><p class="assign-user-note">必须至少选择1名具体用户；只有被分配的用户登录后才能看到该病例。</p>';
    }
    function fields(r){
      var p=r.patient||{}, v=r.vitals||[], im=r.imaging||{};
      var vitalLabels=['血压','空腹血糖','HbA1c','BMI','视力（右）','视力（左）','眼压（右）','眼压（左）'];
      var vitalHtml=vitalLabels.map(function(label,index){var pair=v[index]||[label,''];return '<div class="form-field"><label>'+label+'</label><input class="input" id="f_vital_'+index+'" value="'+esc(pair[1])+'"></div>';}).join('');
      return '<div class="section-block"><h3>一、病例基本信息</h3><p class="section-note">对应前台“虚拟病人信息”卡片，病例号、姓名、性别、年龄、既往史和主诉会直接展示给学员。</p><div class="info-grid">'
        +inputField('f_code','病例号',r.code,false,'mono')+inputField('f_patient_name','姓名',p.name,false)+
        '<div class="form-field"><label>性别</label><select class="select" id="f_gender"><option'+(p.gender==='男'?' selected':'')+'>男</option><option'+(p.gender==='女'?' selected':'')+'>女</option></select></div>'+
        inputField('f_age','年龄',p.age,false)+textField('f_history','既往史',p.history,false,true)+textField('f_chief','主诉',p.chiefComplaint,false,true)+textField('f_summary','结构化病历摘要',r.summary||'',false,true)+'</div></div>'+
        '<div class="section-block"><h3>二、生命体征与检查数据</h3><p class="section-note">前台按固定顺序展示以下 8 项数据；后台只录入病例值，不配置额外指标。</p><div class="info-grid">'+vitalHtml+'</div></div>'+
        '<div class="section-block"><h3>三、患者影像资料</h3><p class="section-note">一个病例只维护一种影像资料；先选择影像类别，再选择单眼或双眼。</p><div class="info-grid">'+
        '<div class="form-field"><label>影像类别</label><select class="select" id="f_image_type" onchange="renderUploadSlots()"><option'+optionSelected(im.type||'眼底彩照','眼底彩照')+'>眼底彩照</option><option'+optionSelected(im.type,'OCT')+'>OCT</option><option'+optionSelected(im.type,'OCTA')+'>OCTA</option></select></div>'+
        '<div class="form-field"><label>单眼 / 双眼</label><select class="select" id="f_eye_mode" onchange="renderUploadSlots()"><option'+optionSelected(im.eyeMode||'双眼','双眼')+'>双眼</option><option'+optionSelected(im.eyeMode,'单眼')+'>单眼</option></select></div>'+
        '<div class="form-field" id="singleEyeField"><label>单眼眼别</label><select class="select" id="f_single_eye" onchange="renderUploadSlots()"><option'+optionSelected(im.singleEye||'右眼','右眼')+'>右眼</option><option'+optionSelected(im.singleEye,'左眼')+'>左眼</option></select></div>'+
        '<div id="uploadSlots" class="upload-slot-list"></div></div></div>'+
        '<div class="section-block"><h3>四、分配用户</h3><p class="section-note">选择该虚拟病例在学生端的可见用户。</p>'+assignedUserSelect(r.audience,'caseAudienceSelect')+'</div>';
    }
    function renderUploadSlots(){
      var typeEl=document.getElementById('f_image_type'),modeEl=document.getElementById('f_eye_mode'),singleEl=document.getElementById('f_single_eye'),field=document.getElementById('singleEyeField'),wrap=document.getElementById('uploadSlots');
      if(!wrap)return;
      var type=typeEl?typeEl.value:'眼底彩照', eyeMode=modeEl?modeEl.value:'双眼', singleEye=singleEl?singleEl.value:'右眼';
      if(field)field.style.display=eyeMode==='单眼'?'grid':'none';
      var sides=eyeMode==='双眼'?['右眼','左眼']:[singleEye];
      wrap.innerHTML=sides.map(function(side){var key=side==='左眼'?'left':'right';return '<div class="upload-slot"><strong>'+esc(type)+'（'+side+'）</strong><input type="file" id="f_file_'+key+'" accept="image/*,.dcm,.dicom"></div>';}).join('');
    }
    function openModal(){
      editing={
        code:'VC-2026-'+String(rows.length+1).padStart(3,'0'),
        patient:{name:'',gender:'女',age:'',history:'',chiefComplaint:''},
        vitals:[['血压',''],['空腹血糖',''],['HbA1c',''],['BMI',''],['视力（右）',''],['视力（左）',''],['眼压（右）',''],['眼压（左）','']],
        summary:'',
        imaging:{type:'眼底彩照',eyeMode:'双眼',singleEye:'右眼',files:{right:'',left:''}},
        audience:[]
      };
      document.getElementById('modalTitle').textContent='新建虚拟病例';
      document.getElementById('modalDesc').textContent='录入学生端展示的病例基本信息、生命体征与患者影像资料，并配置可见人员。';
      document.getElementById('modalBody').innerHTML=fields(editing);
      renderUploadSlots();
      document.getElementById('mask').classList.add('open');document.getElementById('modal').classList.add('open');
    }
    function closeModal(){document.getElementById('mask').classList.remove('open');document.getElementById('modal').classList.remove('open');}
    function value(id){var el=document.getElementById(id);return el?el.value.trim():'';}
    function fileName(id){var el=document.getElementById(id);return el&&el.files&&el.files[0]?el.files[0].name:'';}
    function selectedValues(id){var el=document.getElementById(id);return el?Array.from(el.selectedOptions).map(function(option){return option.value;}):[];}
    function save(){
      var imageType=value('f_image_type')||'眼底彩照', eyeMode=value('f_eye_mode')||'双眼', singleEye=value('f_single_eye')||'右眼';
      var item={
        code:value('f_code'),
        patient:{name:value('f_patient_name'),gender:document.getElementById('f_gender').value,age:value('f_age'),history:value('f_history'),chiefComplaint:value('f_chief')},
        summary:value('f_summary'),
        vitals:[['血压',value('f_vital_0')],['空腹血糖',value('f_vital_1')],['HbA1c',value('f_vital_2')],['BMI',value('f_vital_3')],['视力（右）',value('f_vital_4')],['视力（左）',value('f_vital_5')],['眼压（右）',value('f_vital_6')],['眼压（左）',value('f_vital_7')]],
        imaging:{type:imageType,eyeMode:eyeMode,singleEye:singleEye,files:{right:fileName('f_file_right'),left:fileName('f_file_left')}},
        audience:selectedValues('caseAudienceSelect')
      };
      if(!item.code||!item.patient.name){showToast('请至少填写病例号和患者姓名');return;}
      if(!item.audience.length){showToast('请至少分配1名用户');return;}
      rows.unshift(item);
      closeModal();render();showToast('虚拟病例已保存');
    }
    function openAudienceModal(code){
      var r=rows.find(function(x){return x.code===code;});
      if(!r){showToast('未找到该虚拟病例');return;}
      audienceEditingCode=code;
      document.getElementById('audienceTitle').textContent='分配用户 - '+code;
      document.getElementById('audienceDesc').textContent='只分配当前虚拟病例的可见用户，不修改病例内容。';
      document.getElementById('audienceBody').innerHTML='<div class="section-block"><h3>分配用户</h3>'+assignedUserSelect(r.audience,'audienceSelect')+'</div>';
      document.getElementById('audienceMask').classList.add('open');document.getElementById('audienceModal').classList.add('open');
    }
    function closeAudienceModal(){document.getElementById('audienceMask').classList.remove('open');document.getElementById('audienceModal').classList.remove('open');}
    function saveAudience(){
      var r=rows.find(function(x){return x.code===audienceEditingCode;});
      if(!r){showToast('未找到该虚拟病例');return;}
      var selected=selectedValues('audienceSelect');
      if(!selected.length){showToast('请至少分配1名用户');return;}
      r.audience=selected;
      closeAudienceModal();render();showToast('用户分配已保存');
    }
    function showToast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},1800);}
    render();
  </script>
</body>
</html>
