.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}

document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('headerUserName').textContent = currentUser.name;
  renderTabs();
  renderPanel();
});

function renderTabs(){
  var html = '';
  Object.keys(sourceDefinitions).forEach(function(key){
    var def = sourceDefinitions[key];
    html += '<button type="button" class="source-tab' + (key === activeSource ? ' active' : '') + '" onclick="switchSource(\'' + key + '\')">';
    html += escapeHtml(def.title) + '<span class="source-tab-count">' + def.datasets + '</span>';
    html += '</button>';
  });
  document.getElementById('sourceTabs').innerHTML = html;
}

function switchSource(key){
  if (!sourceDefinitions[key] || key === activeSource) return;
  activeSource = key;
  renderTabs();
  renderPanel();
}

function renderPanel(){
  var html = '';
  var key = activeSource;
  var def = sourceDefinitions[key];
  html += '<section class="card source-panel" id="panel-' + key + '">';
  html += '<div class="card-header"><span class="card-title">' + escapeHtml(def.title) + '</span><span class="page-subtitle">' + escapeHtml(def.subtitle) + '</span></div>';
  html += '<div class="detail-desc">' + escapeHtml(def.desc) + '</div>';
  html += '<div class="distribution-grid">';
  def.distribution.forEach(function(item){
    html += '<div class="dist-item"><strong>' + item.value + '</strong><span>' + escapeHtml(item.label) + '</span><div class="dataset-meta">' + escapeHtml(item.desc) + '</div></div>';
  });
  html += '</div>';
  html += '<div class="list-block"><div class="list-title-row"><h3>' + escapeHtml(def.title) + '列表</h3><span>' + escapeHtml(def.scale) + '</span></div>';
  html += '<div class="filter-bar"><label>关键词搜索</label>';
  html += '<input id="search-' + key + '" placeholder="按数据集名称、疾病、来源机构搜索..." oninput="filterDatasets(\'' + key + '\')">';
  html += '<select id="subtype-' + key + '" onchange="filterDatasets(\'' + key + '\')"><option value="">小类：全部</option>' + def.subtypes.map(function(item){ return '<option value="' + escapeHtml(item.name) + '">' + escapeHtml(item.name) + '</option>'; }).join('') + '</select>';
  html += '<select id="task-' + key + '" onchange="filterDatasets(\'' + key + '\')"><option value="">任务：全部</option>' + getTaskOptions(key).map(function(item){ return '<option value="' + escapeHtml(item) + '">' + escapeHtml(item) + '</option>'; }).join('') + '</select>';
  html += '<button class="btn btn-outline btn-sm" id="sort-' + key + '" onclick="toggleSort(\'' + key + '\')">' + (currentSortOrder[key] === 'desc' ? '最新更新 ↓' : '最新更新 ↑') + '</button><button class="btn btn-outline btn-sm" onclick="resetFilters(\'' + key + '\')">重置筛选</button><span class="match-count" id="match-' + key + '"></span></div>';
  html += '<div class="table-wrap"><table><thead><tr><th>数据集名称</th><th>细分类型</th><th>关联疾病/主题</th><th>任务类型</th><th>数据规模</th><th>来源机构</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tbody-' + key + '"></tbody></table></div>';
  html += '<div class="pagination" id="page-' + key + '"></div></div></section>';
  document.getElementById('sourcePanel').innerHTML = html;
  renderTable(key);
}

function getTaskOptions(key){
  return key === 'original' ? ['干预效果评价','药物疗效评价','随访结局分析','诊疗路径分析','影像质量评价','随访趋势分析'] : ['分类','分割','评价'];
}

function filterDatasets(key){ currentPage[key] = 1; renderTable(key); }

function resetFilters(key){
  document.getElementById('search-' + key).value = '';
  document.getElementById('subtype-' + key).value = '';
  document.getElementById('task-' + key).value = '';
  currentPage[key] = 1;
  renderTable(key);
}

function getFilteredDatasets(key){
  var keyword = document.getElementById('search-' + key).value.trim().toLowerCase();
  var subtype = document.getElementById('subtype-' + key).value;
  var task = document.getElementById('task-' + key).value;
  return allDatasets.filter(function(ds){
    if (ds.sourceKey !== key) return false;
    var text = [ds.name,ds.subtype,ds.disease,ds.task,ds.taskKind,ds.org,ds.desc].join(' ').toLowerCase();
    if (keyword && text.indexOf(keyword) === -1) return false;
    if (subtype && ds.subtype !== subtype) return false;
    if (task && ds.task !== task && ds.taskKind !== task) return false;
    return true;
  });
}

function renderTable(key){
  var def = sourceDefinitions[key];
  var sorted = getFilteredDatasets(key).slice().sort(function(a,b){
    var tA = new Date(a.updateTime).getTime();
    var tB = new Date(b.updateTime).getTime();
    return currentSortOrder[key] === 'desc' ? tB - tA : tA - tB;
  });
  document.getElementById('match-' + key).innerHTML = '当前显示 <strong>' + sorted.length + '</strong> 条 / 本类收录 <strong>' + def.datasets + '</strong> 个数据集';
  var totalPages = Math.ceil(sorted.length / pageSize) || 1;
  if (currentPage[key] > totalPages) currentPage[key] = totalPages;
  var pageData = sorted.slice((currentPage[key] - 1) * pageSize, currentPage[key] * pageSize);
  var html = '';
  pageData.forEach(function(ds){
    html += '<tr><td><div class="dataset-name">' + escapeHtml(ds.name) + '</div><div class="dataset-meta">' + escapeHtml(ds.source) + '</div></td>';
    html += '<td>' + renderSubtype(ds) + '</td><td>' + escapeHtml(ds.disease) + '</td>';
    html += '<td><div class="dataset-name">' + escapeHtml(ds.task) + '</div><div class="dataset-meta">' + escapeHtml(ds.taskKind) + '</div></td>';
    html += '<td>' + escapeHtml(ds.scale) + '<div class="dataset-meta">' + escapeHtml(ds.format) + '</div></td>';
    html += '<td>' + escapeHtml(ds.org) + '</td><td>' + ds.updateTime + '</td>';
    html += '<td><div class="action-cell"><button class="btn btn-outline btn-sm" onclick="openDetail(' + ds.id + ')">查看详情</button><button class="btn btn-success btn-sm" onclick="downloadDataset(' + ds.id + ')">下载</button></div></td></tr>';
  });
  document.getElementById('tbody-' + key).innerHTML = html || '<tr><td colspan="8"><div class="empty">暂无符合条件的数据集</div></td></tr>';
  renderPagination(key,totalPages);
}

function renderPagination(key,totalPages){
  var html = '';
  if (totalPages > 1) {
    html += '<button' + (currentPage[key] === 1 ? ' disabled' : '') + ' onclick="goPage(\'' + key + '\',' + (currentPage[key] - 1) + ')">上一页</button>';
    for (var p = 1; p <= totalPages; p++) html += '<button class="' + (p === currentPage[key] ? 'active' : '') + '" onclick="goPage(\'' + key + '\',' + p + ')">' + p + '</button>';
    html += '<button' + (currentPage[key] === totalPages ? ' disabled' : '') + ' onclick="goPage(\'' + key + '\',' + (currentPage[key] + 1) + ')">下一页</button>';
  }
  document.getElementById('page-' + key).innerHTML = html;
}

function goPage(key,page){ currentPage[key] = page; renderTable(key); scrollToPanel(key); }
function toggleSort(key){ currentSortOrder[key] = currentSortOrder[key] === 'desc' ? 'asc' : 'desc'; document.getElementById('sort-' + key).textContent = currentSortOrder[key] === 'desc' ? '最新更新 ↓' : '最新更新 ↑'; renderTable(key); }
function scrollToPanel(key){ document.getElementById('sourcePanel').scrollIntoView({behavior:'smooth'}); }
function findDataset(id){ return allDatasets.find(function(ds){ return ds.id === id; }); }
function renderSubtype(ds){ return '<span class="tag ' + getSubtypeTagClass(ds.subtype) + '">' + escapeHtml(ds.subtype) + '</span>'; }
function getSubtypeTagClass(subtype){
  if (subtype === '临床试验数据') return 'tag-orange';
  if (subtype === '病历数据') return 'tag-purple';
  if (subtype === '影像数据') return 'tag-blue';
  if (subtype === '眼底图像数据集') return 'tag-blue';
  if (subtype === 'OCT数据集') return 'tag-purple';
  if (subtype === 'OCTA数据集') return 'tag-green';
  return 'tag-gray';
}

function openDetail(id){
  var ds = findDataset(id);
  if (!ds) return;
  document.getElementById('detailModalTitle').textContent = ds.name;
  var html = '<div class="detail-grid">';
  html += '<div class="detail-item"><span>来源大类</span><strong>' + escapeHtml(sourceDefinitions[ds.sourceKey].title) + '</strong></div>';
  html += '<div class="detail-item"><span>细分类型</span><strong>' + escapeHtml(ds.subtype) + '</strong></div>';
  html += '<div class="detail-item"><span>关联疾病/主题</span><strong>' + escapeHtml(ds.disease) + '</strong></div>';
  html += '<div class="detail-item"><span>任务类型</span><strong>' + escapeHtml(ds.task) + '</strong></div>';
  html += '<div class="detail-item"><span>数据规模</span><strong>' + escapeHtml(ds.scale) + '</strong></div>';
  html += '<div class="detail-item"><span>来源机构</span><strong>' + escapeHtml(ds.org) + '</strong></div>';
  html += '<div class="detail-item"><span>更新时间</span><strong>' + escapeHtml(ds.updateTime) + '</strong></div>';
  html += '</div><div class="section-label">数据集简介</div><div class="detail-desc">' + escapeHtml(ds.desc) + '</div><div class="section-label">下载文件</div>';
  ds.attachments.forEach(function(att){
    html += '<a class="file-download-link" href="' + att.url + '" download><span>下载</span><span style="flex:1">' + escapeHtml(att.name) + '</span><span>' + escapeHtml(att.size) + '</span></a>';
  });
  document.getElementById('detailModalBody').innerHTML = html;
  document.getElementById('detailModalFooter').innerHTML = '<button class="btn btn-outline" onclick="closeModal(\'detailModal\')">关闭</button><button class="btn btn-success" onclick="downloadDataset(' + ds.id + ')">下载数据集</button>';
  openModal('detailModal');
}

function downloadDataset(id){
  var ds = findDataset(id);
  if (!ds) return;
  showSuccess('开始下载','正在从平台数据库准备“' + ds.name + '”的数据包。');
}
function openModal(id){ document.getElementById(id).style.display = 'flex'; }
function closeModal(id){ document.getElementById(id).style.display = 'none'; }
function showSuccess(title,msg){ document.getElementById('successTitle').textContent = title; document.getElementById('successMsg').textContent = msg; document.getElementById('successOverlay').style.display = 'flex'; }
function closeSuccess(){ document.getElementById('successOverlay').style.display = 'none'; }
function escapeHtml(text){ var div = document.createElement('div'); div.appendChild(document.createTextNode(text == null ? '' : String(text))); return div.innerHTML; }
function logout(){ if (confirm('确定要退出登录吗？')) { localStorage.removeItem('life_med_user'); window.location.href = 'login.html'; } }
document.addEventListener('click',function(e){ if (e.target.classList.contains('modal-overlay')) e.target.style.display = 'none'; });
</script>
