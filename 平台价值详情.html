<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平台价值详情 - 生命医学主题库</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#fff;
      --text:#111827;
      --muted:#5b667a;
      --soft:#8a97ad;
      --line:#e3e9f3;
      --blue:#2563eb;
      --teal:#0f9a83;
      --shadow:0 12px 32px rgba(20,40,80,.08);
      --radius:12px;
      --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.75}
    a{text-decoration:none;color:inherit}
    .topbar{
      height:64px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);
      display:flex;align-items:center;justify-content:space-between;padding:0 36px;
      position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);
    }
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}
    .brand-mark{
      width:34px;height:34px;border-radius:10px;background:#eaf2ff;color:var(--blue);
      display:grid;place-items:center;font-weight:900;
    }
    .top-actions{display:flex;align-items:center;gap:10px}
    .btn{
      min-height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--line);
      display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;
      background:#fff;color:#374151;
    }
    .btn.primary{border:0;color:#fff;background:linear-gradient(135deg,var(--blue),var(--teal))}
    .hero{
      background:
        radial-gradient(circle at 72% 18%,rgba(37,99,235,.14),transparent 28%),
        linear-gradient(135deg,#edf4ff 0%,#f9fbff 58%,#eef8f6 100%);
      border-bottom:1px solid var(--line);
    }
    .wrap{max-width:1180px;margin:0 auto;padding:0 28px}
    .hero-inner{padding:58px 0 48px;display:grid;grid-template-columns:1.15fr .85fr;gap:42px;align-items:center}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-size:13px;font-weight:800;margin-bottom:16px}
    h1{font-size:42px;line-height:1.15;letter-spacing:-.5px;margin-bottom:16px}
    .lead{font-size:16px;color:var(--muted);max-width:720px}
    .hero-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .metric{
      min-height:106px;background:rgba(255,255,255,.78);border:1px solid rgba(148,163,184,.24);
      border-radius:14px;padding:18px;box-shadow:0 8px 24px rgba(37,99,235,.06);
    }
    .metric strong{display:block;font-size:28px;line-height:1;color:#0f172a;margin-bottom:8px}
    .metric span{font-size:13px;color:var(--soft)}
    main{padding:34px 0 60px}
    .layout{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
    .side{
      position:sticky;top:84px;background:var(--card);border:1px solid var(--line);
      border-radius:var(--radius);padding:10px;box-shadow:var(--shadow);
    }
    .side a{
      display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;
      color:#4b5563;font-size:14px;font-weight:700;
    }
    .side a.active,.side a:hover{background:#eef5ff;color:var(--blue)}
    .content{display:grid;gap:20px}
    .panel{
      background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:28px;
    }
    .panel h2{font-size:22px;margin-bottom:14px}
    .panel p{color:var(--muted);font-size:14px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
    .mini-card{border:1px solid var(--line);border-radius:10px;padding:18px;background:#fbfdff}
    .mini-card h3{font-size:15px;margin-bottom:8px}
    .mini-card p{font-size:13px}
    .list{display:grid;gap:10px;margin-top:12px}
    .list li{
      list-style:none;display:flex;gap:10px;align-items:flex-start;
      color:var(--muted);font-size:14px;
    }
    .list li::before{
      content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);
      margin-top:10px;flex:0 0 auto;
    }
    .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:8px}
    .flow-step{
      min-height:94px;border:1px solid #dce7f8;background:#f8fbff;border-radius:10px;padding:14px;
      position:relative;
    }
    .flow-step b{display:block;color:var(--blue);font-size:13px;margin-bottom:6px}
    .flow-step span{font-size:13px;color:var(--muted)}
    .module-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    .module-links a{
      display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:999px;
      background:#eef5ff;color:var(--blue);font-size:13px;font-weight:700;
    }
    @media(max-width:900px){
      .topbar{padding:0 18px}
      .hero-inner{grid-template-columns:1fr}
      .layout{grid-template-columns:1fr}
      .side{position:static;display:grid;grid-template-columns:repeat(2,1fr)}
      .grid-3,.flow{grid-template-columns:1fr}
      h1{font-size:32px}
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="index.html" class="brand"><span class="brand-mark">医</span><span>生命医学主题库</span></a>
    <div class="top-actions">
      <a class="btn" href="index.html#value">返回平台价值</a>
      <a class="btn primary" href="login.html">进入平台</a>
    </div>
  </header>

  <section class="hero">
    <div class="wrap hero-inner">
      <div>
        <div class="eyebrow" id="eyebrow">平台价值</div>
        <h1 id="pageTitle">支撑智慧医疗</h1>
        <p class="lead" id="pageLead"></p>
      </div>
      <div class="hero-metrics" id="metrics"></div>
    </div>
  </section>

  <main>
    <div class="wrap layout">
      <nav class="side" id="moduleNav"></nav>
      <div class="content">
        <section class="panel">
          <h2>价值定位</h2>
          <p id="positionText"></p>
          <div class="module-links" id="tags"></div>
        </section>
        <section class="panel">
          <h2>核心能力</h2>
          <div class="grid-3" id="capabilities"></div>
        </section>
        <section class="panel">
          <h2>建设路径</h2>
          <div class="flow" id="flow"></div>
        </section>
        <section class="panel">
          <h2>对应系统与页面</h2>
          <ul class="list" id="systems"></ul>
        </section>
      </div>
    </div>
  </main>

        caps: [["标准体系","建设数据采集规范、疾病分类和病灶数据集标准、图像质量评价标准、知识图谱Schema标准。"],["治理加工","覆盖去重、抽取、筛选、转换、清洗、加工、解析、分类和主题化处理。"],["质量审核","通过专家审核与统计分析沉淀质量指标，保障入库数据可信可用。"]],

      ["ai-model","垂域AI模型赋能"],
      ["service","全流程应用服务"]
    ];

    function getModuleKey(){
      var p = new URLSearchParams(location.search);
      var key = p.get("module") || "smart-care";
      return modules[key] ? key : "smart-care";
    }
    function render(){
      var key = getModuleKey();
      var data = modules[key];
      document.title = data.title + " - 平台价值详情";
      document.getElementById("pageTitle").textContent = data.title;
      document.getElementById("pageLead").textContent = data.lead;
      document.getElementById("positionText").textContent = data.position;
      document.getElementById("metrics").innerHTML = data.metrics.map(function(m){
        return '<div class="metric"><strong>' + m[0] + '</strong><span>' + m[1] + '</span></div>';
      }).join("");
      document.getElementById("tags").innerHTML = data.tags.map(function(t){
        return '<a href="javascript:void(0)">' + t + '</a>';
      }).join("");
      document.getElementById("capabilities").innerHTML = data.caps.map(function(c){
        return '<div class="mini-card"><h3>' + c[0] + '</h3><p>' + c[1] + '</p></div>';
      }).join("");
      document.getElementById("flow").innerHTML = data.flow.map(function(f, i){
        return '<div class="flow-step"><b>0' + (i+1) + ' ' + f[0] + '</b><span>' + f[1] + '</span></div>';
      }).join("");
      document.getElementById("systems").innerHTML = data.systems.map(function(s){
        return '<li>' + s + '</li>';
      }).join("");
      document.getElementById("moduleNav").innerHTML = labels.map(function(item){
        return '<a class="' + (item[0] === key ? 'active' : '') + '" href="平台价值详情.html?module=' + item[0] + '">' + item[1] + '</a>';
      }).join("");
    }
    render();
  </script>
</body>
</html>
